<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0A2440">
<title>دخول المسؤول | أواب</title>
<link rel="icon" href="logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&family=Amiri:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="auth.css">
</head>
<body>

<div class="auth">
  <aside class="brand">
    <svg class="arch" viewBox="0 0 360 440" aria-hidden="true">
      <path class="a1" pathLength="1" d="M10 440V180A170 170 0 0 1 350 180V440"/>
      <path class="a2" pathLength="1" d="M40 440V180A140 140 0 0 1 320 180V440"/>
      <path class="a3" pathLength="1" d="M70 440V180A110 110 0 0 1 290 180V440"/>
      <path class="window" d="M96 440V180A84 84 0 0 1 264 180V440Z"/>
      <image href="logo.png" x="104" y="218" width="152" height="76" preserveAspectRatio="xMidYMid meet"/>
    </svg>
    <div class="brand-mini"><img src="logo.png" alt="أواب"></div>
    <div class="brand-text">
      <h2>لوحة تحكم أواب</h2>
      <p>أدر الكورسات والمسابقات والمستخدمين والدعم الفني من مكان واحد.</p>
    </div>
  </aside>

  <main class="form-side">
    <div class="form-box">
      <div class="form-head">
        <h1>دخول المسؤول</h1>
        <p>سجّل دخولك لإدارة المنصة.</p>
      </div>

      <div class="notice" id="formMsg" role="alert" aria-live="polite"></div>

      <form id="adminLoginForm" novalidate>
        <div class="field">
          <label for="adminUser">اسم المستخدم</label>
          <div class="control">
            <input type="text" id="adminUser" class="ltr" autocomplete="username" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="admin" required>
          </div>
        </div>
        <div class="field">
          <label for="adminPass">كلمة المرور</label>
          <div class="control has-eye">
            <input type="password" id="adminPass" class="ltr" autocomplete="current-password" placeholder="••••••••" required>
            <button type="button" class="eye" id="togglePass" aria-label="إظهار كلمة المرور"></button>
          </div>
        </div>
        <button type="submit" class="btn btn-primary" id="loginBtn">
          <span class="btn-text">دخول لوحة التحكم</span>
          <span class="spinner" aria-hidden="true"></span>
        </button>
      </form>
    </div>
  </main>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="firebase-config.js"></script>
<script>
  const ICON_EYE = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>';
  const ICON_EYE_OFF = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.94 10.94 0 0 1 12 20c-7 0-11-8-11-8a18.6 18.6 0 0 1 5.06-5.94M9.9 4.24A10.94 10.94 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>';
  const ICON_INFO = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>';
  document.getElementById('togglePass').innerHTML = ICON_EYE;

  /* بيانات دخول لوحة التحكم كما طُلب: admin / 123
     خلف الكواليس تُستخدم هذه البيانات لتسجيل الدخول لحساب المسؤول الحقيقي
     admin@awab.su.com، وهو نفس الحساب الذي يستطيع المسؤول تسجيل الدخول به
     مباشرة في موقع المستخدم (index.html هناك) للرد على تعليقات الناس. */
  const ADMIN_USERNAME = 'admin';
  const ADMIN_PASSWORD = '123';
  const ADMIN_REAL_EMAIL = 'admin@awab.su.com';
  const ADMIN_REAL_PASSWORD = '500500';

  auth.onAuthStateChanged(function (user) {
    if (!user) return;
    db.ref('users/' + user.uid).once('value').then(function (snap) {
      const data = snap.val();
      if (data && data.isAdmin === true) window.location.href = 'home.html';
    });
  });

  const form = document.getElementById('adminLoginForm');
  const formMsg = document.getElementById('formMsg');
  const loginBtn = document.getElementById('loginBtn');
  const togglePass = document.getElementById('togglePass');
  const passInput = document.getElementById('adminPass');

  togglePass.addEventListener('click', function () {
    const isPass = passInput.type === 'password';
    passInput.type = isPass ? 'text' : 'password';
    togglePass.innerHTML = isPass ? ICON_EYE_OFF : ICON_EYE;
  });

  function showMsg(text, type) { formMsg.className = 'notice show ' + type; formMsg.innerHTML = ICON_INFO + '<span></span>'; formMsg.lastChild.textContent = text; }

  form.addEventListener('submit', function (e) {
    e.preventDefault();
    formMsg.className = 'notice';
    const u = document.getElementById('adminUser').value.trim();
    const p = passInput.value;

    if (u !== ADMIN_USERNAME || p !== ADMIN_PASSWORD) {
      showMsg('اسم المستخدم أو كلمة المرور غير صحيحة', 'error');
      return;
    }

    loginBtn.disabled = true;
    loginBtn.classList.add('loading');

    auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL)
      .then(function () { return auth.signInWithEmailAndPassword(ADMIN_REAL_EMAIL, ADMIN_REAL_PASSWORD); })
      .then(function () { window.location.href = 'home.html'; })
      .catch(function (err) {
        if (err.code === 'auth/user-not-found' || err.code === 'auth/invalid-credential') {
          auth.createUserWithEmailAndPassword(ADMIN_REAL_EMAIL, ADMIN_REAL_PASSWORD)
            .then(function (cred) {
              return cred.user.updateProfile({ displayName: 'المسؤول' }).then(function () {
                return db.ref('users/' + cred.user.uid).set({
                  name: 'المسؤول', email: ADMIN_REAL_EMAIL, points: 0, isAdmin: true,
                  createdAt: firebase.database.ServerValue.TIMESTAMP
                });
              });
            })
            .then(function () { window.location.href = 'home.html'; })
            .catch(function (err2) {
              showMsg('تعذر تجهيز حساب المسؤول: ' + (err2.code || err2.message), 'error');
              loginBtn.disabled = false; loginBtn.classList.remove('loading');
            });
        } else {
          showMsg('حدث خطأ أثناء الدخول (' + (err.code || 'غير معروف') + ')', 'error');
          loginBtn.disabled = false; loginBtn.classList.remove('loading');
        }
      });
  });
</script>
</body>
</html>
