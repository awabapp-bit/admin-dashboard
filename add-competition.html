<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5">
<title>إضافة محتوى جديد — لوحة تحكم أواب</title>
<link rel="icon" href="logo.png">
<link rel="stylesheet" href="style.css">
<script>(function(){try{var t=localStorage.getItem('adminTheme');if(t==='dark'||(!t&&window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches)){document.documentElement.setAttribute('data-theme','dark');}}catch(e){}})();</script>
</head>
<body>

<nav class="admin-nav" id="adminNav"></nav>

<main class="admin-page" style="max-width:600px;">
  <a class="back-link" href="home.html" id="backLink">كل المحتوى</a>
  <h1 class="page-title">إضافة محتوى جديد</h1>
  <p class="page-sub">يظهر فور الحفظ مباشرة على الموقع للمستخدمين</p>

  <div class="info-card">
    <div class="form-msg" id="formMsg"></div>
    <form id="addCompForm">
      <div class="field">
        <label>نوع المحتوى</label>
        <div style="display:flex; gap:10px;">
          <label style="flex:1; display:flex; align-items:center; gap:8px; padding:12px 14px; border:1.5px solid var(--border); border-radius:var(--radius-sm); cursor:pointer;" id="courseTypeLabel">
            <input type="radio" name="contentType" value="course" checked style="accent-color:var(--primary);">
            <span id="courseTypeIcon"></span> كورس
          </label>
          <label style="flex:1; display:flex; align-items:center; gap:8px; padding:12px 14px; border:1.5px solid var(--border); border-radius:var(--radius-sm); cursor:pointer;" id="compTypeLabel">
            <input type="radio" name="contentType" value="competition" style="accent-color:var(--gold);">
            <span id="compTypeIcon"></span> مسابقة
          </label>
        </div>
        <div class="field-hint">هيظهر للمستخدم زر "اشتراك في الكورس" لو كورس، أو "انضمام للمسابقة" لو مسابقة</div>
      </div>

      <div class="field">
        <label for="compTitle">الاسم</label>
        <input type="text" id="compTitle" placeholder="مثال: كورس التجويد الأساسي" required>
      </div>
      <div class="field">
        <label for="compDesc">الوصف (اختياري)</label>
        <textarea id="compDesc" rows="4" placeholder="وصف كامل يظهر في صفحة المحتوى" style="width:100%; padding:13px 15px; border:1.5px solid var(--border); border-radius:var(--radius-sm); font-family:inherit; font-size:0.9375rem; resize:vertical;"></textarea>
      </div>
      <div class="field">
        <label for="compCover">رابط صورة الغلاف (اختياري)</label>
        <input type="url" id="compCover" placeholder="https://...">
      </div>
      <button type="submit" class="btn btn-gold" id="saveBtn">حفظ</button>
    </form>
  </div>
</main>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="icons.js"></script>
<script src="admin-shell.js"></script>
<script>
  document.getElementById('backLink').innerHTML = icon('arrowRight', 'icon-sm') + ' كل المحتوى';
  document.getElementById('courseTypeIcon').innerHTML = icon('bookOpen', 'icon-sm');
  document.getElementById('compTypeIcon').innerHTML = icon('trophy', 'icon-sm');

  let currentAdmin = null;
  requireAdminAuth(function (user) { currentAdmin = user; renderAdminNav('home'); });

  document.getElementById('addCompForm').addEventListener('submit', function (e) {
    e.preventDefault();
    const msg = document.getElementById('formMsg');
    const title = document.getElementById('compTitle').value.trim();
    const description = document.getElementById('compDesc').value.trim();
    const coverUrl = document.getElementById('compCover').value.trim();
    const type = document.querySelector('input[name="contentType"]:checked').value;
    const saveBtn = document.getElementById('saveBtn');
    if (!title) return;

    saveBtn.disabled = true;
    saveBtn.textContent = 'جارٍ الحفظ...';

    db.ref('competitions').push({
      title: title, description: description || '', coverUrl: coverUrl || null, type: type,
      createdBy: currentAdmin.uid, createdAt: firebase.database.ServerValue.TIMESTAMP
    }).then(function (ref) {
      window.location.href = 'competition.html?id=' + encodeURIComponent(ref.key);
    }).catch(function (err) {
      msg.textContent = 'تعذر الحفظ: ' + err.message;
      msg.className = 'form-msg show error';
      saveBtn.disabled = false; saveBtn.textContent = 'حفظ';
    });
  });
</script>
</body>
</html>
