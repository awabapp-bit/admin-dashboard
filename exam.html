<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5">
<title>أسئلة الاختبار — لوحة تحكم أواب</title>
<link rel="icon" href="logo.png">
<link rel="stylesheet" href="style.css">
<script>(function(){try{var t=localStorage.getItem('adminTheme');if(t==='dark'||(!t&&window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches)){document.documentElement.setAttribute('data-theme','dark');}}catch(e){}})();</script>
<style>
  .exam-summary-bar{
    display:flex; gap:24px; flex-wrap:wrap; align-items:center;
    background: var(--gold-pale); border: 1px solid var(--gold-light);
    border-radius: var(--radius); padding: 14px 20px; margin: 18px 0 26px;
  }
  .exam-summary-item{ display:flex; align-items:center; gap:8px; font-size:0.875rem; color: var(--primary-dark); font-weight:700; }
  .exam-summary-item .icon{ color: var(--gold); }
  .exam-summary-item span.num{ font-family:'IBM Plex Mono', ui-monospace, monospace; font-weight:700; font-size:1.125rem; }
</style>
</head>
<body>

<nav class="admin-nav" id="adminNav"></nav>

<main class="admin-page" style="max-width:760px;">
  <a class="back-link" id="backLink" href="lesson.html">إلغاء والرجوع لبيانات المحاضرة</a>
  <h1 class="page-title">أسئلة الاختبار</h1>
  <p class="page-sub">أضف عنوان الاختبار ثم أسئلته؛ يظهر عدد الأسئلة ومجموع النقاط تلقائيًا أدناه</p>

  <div class="form-msg" id="formMsg"></div>

  <div class="info-card">
    <div class="field">
      <label for="examTitle">عنوان الاختبار</label>
      <input type="text" id="examTitle" placeholder="مثال: اختبار الدرس الأول" required>
    </div>
    <div class="field">
      <label for="examRelease">معاد نزول الاختبار</label>
      <input type="datetime-local" id="examRelease" required>
      <div class="field-hint">لن يظهر هذا الاختبار للطلاب ولن يقدروا يفتحوه قبل هذا الموعد.</div>
    </div>
  </div>

  <div class="exam-summary-bar">
    <div class="exam-summary-item" id="qCountItem">عدد الأسئلة: <span class="num" id="qCountNum">0</span></div>
    <div class="exam-summary-item" id="pointsItem">إجمالي النقاط: <span class="num" id="pointsNum">0</span></div>
  </div>

  <div id="questionsWrap"></div>

  <button type="button" class="btn btn-outline btn-sm" id="addQuestionBtn" style="width:auto;">إضافة سؤال</button>

  <button type="button" class="btn btn-primary" id="saveExamBtn" style="margin-top:22px;">حفظ والعودة لبيانات المحاضرة</button>
</main>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="icons.js"></script>
<script src="admin-shell.js"></script>
<script>
  document.getElementById('backLink').innerHTML = icon('arrowRight', 'icon-sm') + ' إلغاء والرجوع لبيانات المحاضرة';
  document.getElementById('addQuestionBtn').innerHTML = icon('plus') + ' إضافة سؤال';
  document.getElementById('saveExamBtn').innerHTML = icon('floppyDisk') + ' حفظ والعودة لبيانات المحاضرة';
  document.getElementById('qCountItem').innerHTML = icon('listCheck', 'icon-sm') + ' عدد الأسئلة: <span class="num" id="qCountNum">0</span>';
  document.getElementById('pointsItem').innerHTML = icon('medal', 'icon-sm') + ' إجمالي النقاط: <span class="num" id="pointsNum">0</span>';

  const params   = new URLSearchParams(window.location.search);
  const compId   = params.get('comp');
  const lessonId = params.get('lesson') || 'new';
  const examLocalId = params.get('exam');

  if (!compId || !examLocalId) window.location.href = 'home.html';

  const draftKey = 'awab_lesson_draft::' + compId + '::' + lessonId;
  const questionsWrap = document.getElementById('questionsWrap');
  const examTitleInput = document.getElementById('examTitle');
  const examReleaseInput = document.getElementById('examRelease');

  function toDatetimeLocalValue(ts) {
    const d = new Date(ts);
    const pad = function (n) { return String(n).padStart(2, '0'); };
    return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()) + 'T' + pad(d.getHours()) + ':' + pad(d.getMinutes());
  }

  document.getElementById('backLink').href = 'lesson.html?comp=' + encodeURIComponent(compId) + (lessonId !== 'new' ? '&lesson=' + encodeURIComponent(lessonId) : '');

  let draft = null;
  let examEntry = null;
  let qCounter = 0;

  requireAdminAuth(function () {
    renderAdminNav('home');

    const raw = localStorage.getItem(draftKey);
    if (!raw) { window.location.href = document.getElementById('backLink').href; return; }
    try { draft = JSON.parse(raw); } catch (e) { window.location.href = document.getElementById('backLink').href; return; }

    draft.exams = draft.exams || [];
    examEntry = draft.exams.find(function (e) { return e.localId === examLocalId; });
    if (!examEntry) {
      examEntry = { localId: examLocalId, key: '', title: '', questions: [] };
      draft.exams.push(examEntry);
    }

    examTitleInput.value = examEntry.title || '';
    examReleaseInput.value = examEntry.releaseAt || draft.releaseAt || '';
    (examEntry.questions || []).forEach(function (q) { addQuestionBlock(q, q.key); });
    updateSummary();
  });

  function addQuestionBlock(existingQ, existingQKey) {
    qCounter++;
    const qNum = qCounter;
    const uid = 'q' + qNum + '_' + Date.now();
    const qBlock = document.createElement('div');
    qBlock.className = 'question-builder';
    qBlock.dataset.key = existingQKey || '';

    const opts = (existingQ && existingQ.options) || ['', '', '', ''];
    const correct = existingQ && existingQ.correct != null ? existingQ.correct : 0;
    const points = existingQ ? existingQ.points : 1;
    const text = existingQ ? existingQ.text : '';

    qBlock.innerHTML =
      '<div class="q-header"><h4>سؤال #<span class="qi-index">' + qNum + '</span></h4>' +
        '<button type="button" class="q-remove-btn qq-remove">' + icon('trash', 'icon-sm') + ' حذف السؤال</button></div>' +
      '<div class="field"><label>نص السؤال</label><input type="text" class="qq-text" value="' + escapeHtml(text) + '" required></div>' +
      [0, 1, 2, 3].map(function (i) {
        return '<div class="option-row">' +
          '<input type="radio" name="correct-' + uid + '" class="qq-correct" value="' + i + '" ' + (correct === i ? 'checked' : '') + '>' +
          '<span class="option-label">' + (i + 1) + '</span>' +
          '<input type="text" class="qq-option" placeholder="نص الإجابة ' + (i + 1) + '" value="' + escapeHtml(opts[i] || '') + '" required>' +
        '</div>';
      }).join('') +
      '<div class="field" style="margin:10px 0 0;"><label>نقاط الإجابة الصحيحة</label><input type="number" class="qq-points" min="1" value="' + (points || 1) + '" required style="max-width:120px;"></div>';

    questionsWrap.appendChild(qBlock);

    qBlock.querySelector('.qq-remove').addEventListener('click', function () {
      qBlock.remove();
      Array.from(questionsWrap.children).forEach(function (el, i) { el.querySelector('.qi-index').textContent = i + 1; });
      updateSummary();
      autosaveDraft();
    });
    qBlock.querySelectorAll('.qq-points, .qq-correct').forEach(function (inp) {
      inp.addEventListener('input', updateSummary);
      inp.addEventListener('change', updateSummary);
    });
  }
  document.getElementById('addQuestionBtn').addEventListener('click', function () { addQuestionBlock(); updateSummary(); autosaveDraft(); });

  /* ---------------- حفظ تلقائي فوري في localStorage أثناء الكتابة ----------------
     كده لو حصل ريفريش للصفحة أو المستخدم قفل المتصفح/التطبيق قبل ما يضغط "حفظ"،
     الأسئلة اللي كتبها لسه محفوظة ومش هتتشال. localStorage (مش sessionStorage)
     عشان يفضل موجود حتى لو الموبايل قفل التبويب أو اتفصل ورجع تاني على نفس الجهاز. */
  function collectExamStateLenient() {
    const qBlocks = Array.from(questionsWrap.children);
    const questions = qBlocks.map(function (qb) {
      const correctRadio = qb.querySelector('.qq-correct:checked');
      return {
        key: qb.dataset.key || '',
        text: qb.querySelector('.qq-text').value,
        options: Array.from(qb.querySelectorAll('.qq-option')).map(function (inp) { return inp.value; }),
        correct: correctRadio ? parseInt(correctRadio.value, 10) : null,
        points: parseInt(qb.querySelector('.qq-points').value, 10) || 1
      };
    });
    return { title: examTitleInput.value, releaseAt: examReleaseInput.value, questions: questions };
  }

  function autosaveDraft() {
    if (!draft || !examEntry) return;
    const state = collectExamStateLenient();
    examEntry.title = state.title;
    examEntry.releaseAt = state.releaseAt;
    examEntry.questions = state.questions;
    const idx = draft.exams.findIndex(function (e) { return e.localId === examLocalId; });
    if (idx >= 0) draft.exams[idx] = examEntry; else draft.exams.push(examEntry);
    try { localStorage.setItem(draftKey, JSON.stringify(draft)); } catch (e) { /* تجاهل خطأ تخزين مؤقت */ }
  }

  let autosaveTimer = null;
  function scheduleAutosave() {
    clearTimeout(autosaveTimer);
    autosaveTimer = setTimeout(autosaveDraft, 300);
  }
  document.addEventListener('input', scheduleAutosave);
  document.addEventListener('change', scheduleAutosave);
  window.addEventListener('beforeunload', autosaveDraft);
  document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'hidden') autosaveDraft(); });

  function updateSummary() {
    const blocks = Array.from(questionsWrap.children);
    document.getElementById('qCountNum').textContent = blocks.length;
    const total = blocks.reduce(function (sum, b) {
      return sum + (parseInt(b.querySelector('.qq-points').value, 10) || 0);
    }, 0);
    document.getElementById('pointsNum').textContent = total;
  }

  document.getElementById('saveExamBtn').addEventListener('click', function () {
    const msg = document.getElementById('formMsg');
    msg.classList.remove('show');

    const title = examTitleInput.value.trim();
    if (!title) { msg.textContent = 'من فضلك اكتب عنوان الاختبار'; msg.className = 'form-msg show error'; return; }

    const releaseVal = examReleaseInput.value;
    if (!releaseVal) { msg.textContent = 'من فضلك حدد معاد نزول الاختبار'; msg.className = 'form-msg show error'; return; }

    const qBlocks = Array.from(questionsWrap.children);
    if (qBlocks.length === 0) { msg.textContent = 'أضف سؤالاً واحدًا على الأقل'; msg.className = 'form-msg show error'; return; }

    const questions = [];
    for (let i = 0; i < qBlocks.length; i++) {
      const qb = qBlocks[i];
      const text = qb.querySelector('.qq-text').value.trim();
      const options = Array.from(qb.querySelectorAll('.qq-option')).map(function (inp) { return inp.value.trim(); });
      const correctRadio = qb.querySelector('.qq-correct:checked');
      const points = parseInt(qb.querySelector('.qq-points').value, 10) || 1;
      if (!text || options.some(function (o) { return !o; }) || !correctRadio) {
        msg.textContent = 'تأكد من إكمال كل حقول السؤال #' + (i + 1);
        msg.className = 'form-msg show error';
        return;
      }
      questions.push({ key: qb.dataset.key || '', text: text, options: options, correct: parseInt(correctRadio.value, 10), points: points });
    }

    examEntry.title = title;
    examEntry.releaseAt = releaseVal;
    examEntry.questions = questions;

    const idx = draft.exams.findIndex(function (e) { return e.localId === examLocalId; });
    if (idx >= 0) draft.exams[idx] = examEntry; else draft.exams.push(examEntry);

    try {
      localStorage.setItem(draftKey, JSON.stringify(draft));
    } catch (e) {
      msg.textContent = 'تعذر حفظ التغييرات مؤقتًا: ' + e.message;
      msg.className = 'form-msg show error';
      return;
    }

    window.location.href = document.getElementById('backLink').href;
  });
</script>
</body>
</html>
