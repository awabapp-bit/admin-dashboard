<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
  <title>الدعم الفني — لوحة تحكم أواب</title>
  <link rel="icon" href="logo.png">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="style.css">
  <style>
    :root {
      --sup-bg-gradient: linear-gradient(135deg, var(--bg) 0%, #eef1f6 50%, #e4e8f0 100%);
      --sup-card-bg: rgba(255,255,255,0.7);
      --sup-card-border: var(--border);
      --sup-primary: var(--primary);
      --sup-primary-hover: var(--primary-dark);
      --sup-primary-glow: rgba(27,77,53,0.15);
      --sup-accent: var(--gold);
      --sup-text: var(--text);
      --sup-text-muted: var(--text-muted);
      --sup-danger: var(--danger);
      --sup-success: var(--success);
      --sup-message-admin: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
      --sup-message-user: #f1f5f9;
      --sup-input-bg: #ffffff;
      --sup-input-border: var(--border);
      --sup-dropdown-bg: rgba(255,255,255,0.97);
      --sup-hover-bg: rgba(27,77,53,0.06);
      --sup-chat-messages-bg: rgba(246,244,238,0.5);
      --sup-recording-bg: rgba(255,255,255,0.98);
      --sup-sidebar-bg: rgba(246,244,238,0.9);
    }
    #support-root *{box-sizing:border-box}
    #support-root{font-family:'Cairo',sans-serif}
    body.chat-active{overflow:hidden}

    .support-shell{display:flex;flex-direction:column;height:100vh}

    .offline-screen{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(246,244,238,0.9);backdrop-filter:blur(25px);z-index:99999;display:flex;justify-content:center;align-items:center;opacity:0;pointer-events:none;transform:scale(1.08);transition:all 0.5s cubic-bezier(0.34,1.56,0.64,1)}
    .offline-screen.active{opacity:1;pointer-events:all;transform:scale(1)}
    .offline-content{text-align:center;padding:40px;max-width:420px;width:90%;background:rgba(255,255,255,0.85);border:1px solid var(--sup-card-border);border-radius:var(--radius-lg);box-shadow:var(--shadow)}
    .offline-icon-wrapper{width:100px;height:100px;border-radius:50%;background:rgba(179,67,43,0.1);display:flex;justify-content:center;align-items:center;margin:0 auto 25px;position:relative}
    .offline-icon-wrapper::after{content:'';position:absolute;width:100%;height:100%;border-radius:50%;border:2px solid rgba(179,67,43,0.3);animation:supPulseGlow 2s infinite}
    @keyframes supPulseGlow{0%{transform:scale(1);opacity:1}100%{transform:scale(1.4);opacity:0}}
    .offline-title{font-size:22px;font-weight:800;color:var(--sup-text);margin-bottom:12px}
    .offline-sub{font-size:14px;color:var(--sup-text-muted);line-height:1.6;margin-bottom:25px}
    .offline-loader{display:flex;justify-content:center;gap:8px}
    .offline-dot{width:8px;height:8px;border-radius:50%;background:var(--sup-danger);animation:supJump 1.2s infinite alternate}
    .offline-dot:nth-child(2){animation-delay:0.2s}
    .offline-dot:nth-child(3){animation-delay:0.4s}
    @keyframes supJump{0%{transform:translateY(0)}100%{transform:translateY(-8px)}}

    .dashboard-container{display:none;width:100%;flex:1;min-height:0}
    .dashboard-container.active{display:flex}

    .sidebar{width:380px;border-left:1px solid var(--sup-card-border);background:var(--sup-sidebar-bg);backdrop-filter:blur(20px);display:flex;flex-direction:column;height:100%}
    .sidebar-header{padding:18px 25px;border-bottom:1px solid var(--sup-card-border);display:flex;align-items:center}
    .admin-profile{display:flex;align-items:center;gap:12px}
    .admin-avatar{width:40px;height:40px;border-radius:50%;background:var(--sup-primary);display:flex;justify-content:center;align-items:center;font-size:18px;font-weight:bold;color:#fff}
    .admin-name-txt{font-weight:700;font-size:15px;color:var(--sup-text)}
    .admin-role{font-size:11px;color:var(--sup-accent)}

    .conv-list{flex:1;overflow-y:auto;padding:10px;display:flex;flex-direction:column;gap:8px}
    .conv-list::-webkit-scrollbar{width:5px}
    .conv-list::-webkit-scrollbar-thumb{background:rgba(0,0,0,0.08);border-radius:3px}
    .conv-item{display:flex;align-items:center;gap:15px;padding:12px 18px;border-radius:16px;cursor:pointer;position:relative}
    .conv-item:hover{background:var(--sup-hover-bg)}
    .conv-item.active{background:rgba(27,77,53,0.1);border:1px solid rgba(27,77,53,0.2)}
    .user-avatar{width:48px;height:48px;border-radius:50%;background:rgba(0,0,0,0.04);border:1px solid rgba(0,0,0,0.06);display:flex;justify-content:center;align-items:center;font-size:20px;color:var(--sup-primary);flex-shrink:0}
    .conv-details{flex:1;min-width:0}
    .conv-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px}
    .conv-name{font-weight:700;font-size:14px;color:var(--sup-text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .conv-time{font-size:11px;color:var(--sup-text-muted)}
    .conv-last-msg{font-size:13px;color:var(--sup-text-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .unread-badge{background:var(--sup-danger);color:#fff;font-size:10px;font-weight:bold;min-width:18px;height:18px;border-radius:50%;display:flex;justify-content:center;align-items:center;padding:0 4px}
    .no-conv-msg{text-align:center;color:var(--sup-text-muted);padding:40px 20px;font-size:14px}

    .chat-pane{flex:1;display:flex;flex-direction:column;height:100%;background:rgba(255,255,255,0.1);position:relative}
    .chat-placeholder{position:absolute;top:0;left:0;width:100%;height:100%;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:15px;color:var(--sup-text-muted);z-index:5;background:rgba(246,244,238,0.95)}
    .chat-placeholder i{font-size:60px;background:linear-gradient(135deg,var(--sup-primary),var(--sup-accent));-webkit-background-clip:text;-webkit-text-fill-color:transparent;opacity:0.8}

    .chat-header{padding:15px 25px;background:rgba(255,255,255,0.45);border-bottom:1px solid var(--sup-card-border);display:flex;align-items:center;gap:15px}
    .back-btn{display:none;background:none;border:none;color:var(--sup-text);font-size:20px;cursor:pointer;width:36px;height:36px;border-radius:50%;justify-content:center;align-items:center}
    .back-btn:hover{background:var(--sup-hover-bg)}
    .header-user-info{display:flex;align-items:center;gap:12px}
    .header-avatar{width:44px;height:44px;border-radius:50%;background:var(--sup-hover-bg);border:1px solid var(--sup-card-border);display:flex;justify-content:center;align-items:center;font-size:18px;color:var(--sup-primary)}
    .header-user-details{display:flex;flex-direction:column}
    .header-name{font-weight:700;font-size:16px;color:var(--sup-text)}
    .header-user-status{font-size:11px;color:var(--sup-text-muted)}
    .header-user-status.online{color:var(--sup-success)}

    .chat-messages{flex:1;padding:25px;overflow-y:auto;display:flex;flex-direction:column;gap:15px;background:var(--sup-chat-messages-bg)}
    .chat-messages::-webkit-scrollbar{width:6px}
    .chat-messages::-webkit-scrollbar-thumb{background:rgba(0,0,0,0.08);border-radius:3px}

    .msg-group{display:flex;flex-direction:column;max-width:75%}
    .msg-group.admin{align-self:flex-start;align-items:flex-end}
    .msg-group.user{align-self:flex-end;align-items:flex-start}
    .message{padding:12px 18px;border-radius:18px;font-size:14px;line-height:1.6;word-break:break-word}
    .msg-group.admin .message{background:var(--sup-message-admin);color:#fff;border-top-left-radius:2px;box-shadow:0 4px 12px var(--sup-primary-glow)}
    .msg-group.user .message{background:var(--sup-message-user);color:var(--sup-text);border-top-right-radius:2px;border:1px solid var(--sup-card-border)}
    .msg-time{font-size:10px;color:var(--sup-text-muted);margin-top:5px;padding:0 5px}

    .msg-img{max-width:100%;max-height:250px;border-radius:12px;cursor:pointer;display:block}
    .msg-img:hover{opacity:0.9}

    .msg-voice-player{display:flex;align-items:center;gap:10px;min-width:220px;padding:5px 0}
    .voice-play-btn{width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,0.2);border:none;color:#fff;cursor:pointer;display:flex;justify-content:center;align-items:center;font-size:14px;flex-shrink:0}
    .msg-group.user .voice-play-btn{background:var(--sup-hover-bg);color:var(--sup-text)}
    .voice-progress-bar{flex:1;height:4px;background:rgba(255,255,255,0.2);border-radius:2px;position:relative;cursor:pointer}
    .msg-group.user .voice-progress-bar{background:rgba(0,0,0,0.08)}
    .voice-progress-fill{height:100%;width:0%;background:#fff;border-radius:2px;position:absolute;top:0;right:0}
    .msg-group.user .voice-progress-fill{background:var(--sup-primary)}
    .voice-time{font-size:11px;color:#fff;min-width:35px}
    .msg-group.user .voice-time{color:var(--sup-text)}

    .msg-file-download{display:flex;align-items:center;gap:12px;background:rgba(255,255,255,0.1);padding:10px 15px;border-radius:12px;text-decoration:none;color:#fff;font-size:13px;border:1px solid rgba(255,255,255,0.1)}
    .msg-group.user .msg-file-download{background:var(--sup-hover-bg);color:var(--sup-text);border-color:var(--sup-card-border)}
    .msg-file-download:hover{opacity:0.85}
    .file-name-txt{max-width:150px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

    .chat-input-bar{padding:20px 25px;background:rgba(255,255,255,0.45);border-top:1px solid var(--sup-card-border);display:flex;align-items:center;gap:12px;position:relative}
    .chat-input-wrapper{flex:1;display:flex;align-items:center;background:var(--sup-input-bg);border:1px solid var(--sup-input-border);border-radius:16px;padding:5px 15px}
    .chat-input-wrapper:focus-within{border-color:var(--sup-primary);box-shadow:0 0 15px var(--sup-primary-glow)}
    .chat-input-wrapper textarea{width:100%;background:none;border:none;outline:none;color:var(--sup-text);font-size:14px;resize:none;padding:8px 0;height:38px;max-height:100px;line-height:22px;font-family:'Cairo',sans-serif}
    .input-attachment-btn{background:none;border:none;color:var(--sup-text-muted);font-size:18px;cursor:pointer;width:35px;height:35px;border-radius:50%;display:flex;justify-content:center;align-items:center;flex-shrink:0}
    .input-attachment-btn:hover{color:var(--sup-text);background:var(--sup-hover-bg)}
    .send-msg-btn{width:48px;height:48px;border-radius:16px;background:var(--sup-primary);border:none;color:#fff;font-size:18px;cursor:pointer;display:flex;justify-content:center;align-items:center;box-shadow:0 5px 15px var(--sup-primary-glow);flex-shrink:0}
    .send-msg-btn:hover{background:var(--sup-primary-hover);transform:scale(1.05)}

    .attachment-menu{position:absolute;bottom:85px;right:25px;background:var(--sup-dropdown-bg);backdrop-filter:blur(15px);border:1px solid var(--sup-card-border);border-radius:16px;padding:8px;display:none;flex-direction:column;gap:5px;box-shadow:var(--shadow);z-index:101}
    .attachment-menu.active{display:flex}
    .attach-item{padding:10px 15px;border-radius:10px;font-size:13px;color:var(--sup-text);display:flex;align-items:center;gap:12px;cursor:pointer}
    .attach-item:hover{background:var(--sup-hover-bg)}
    .attach-item.image-item i{color:var(--sup-accent)}
    .attach-item.audio-item i{color:var(--sup-primary)}
    .attach-item.doc-item i{color:var(--sup-success)}
    .size-note{font-size:11px;color:var(--sup-text-muted);padding:4px 12px 6px;border-top:1px solid var(--sup-card-border);margin-top:3px}

    .recording-overlay{position:absolute;top:0;left:0;width:100%;height:100%;background:var(--sup-recording-bg);display:none;align-items:center;justify-content:space-between;padding:0 25px;z-index:5}
    .recording-overlay.active{display:flex}
    .rec-status{display:flex;align-items:center;gap:10px}
    .rec-dot{width:10px;height:10px;border-radius:50%;background:var(--sup-danger);animation:supPulse 1s infinite;box-shadow:0 0 10px var(--sup-danger)}
    @keyframes supPulse{0%,100%{opacity:1}50%{opacity:0.5}}
    .rec-timer{font-size:14px;font-weight:600;color:var(--sup-text)}
    .rec-waves{display:flex;align-items:center;gap:3px;height:20px}
    .rec-wave-bar{width:3px;height:5px;background:var(--sup-primary);border-radius:3px;animation:supWave 1s ease-in-out infinite alternate}
    .rec-wave-bar:nth-child(2){animation-delay:0.2s;height:10px}
    .rec-wave-bar:nth-child(3){animation-delay:0.4s;height:15px}
    .rec-wave-bar:nth-child(4){animation-delay:0.6s;height:8px}
    @keyframes supWave{0%{height:5px}100%{height:20px}}
    .rec-actions{display:flex;align-items:center;gap:15px}
    .rec-btn-cancel{background:none;border:none;color:var(--sup-danger);cursor:pointer;font-size:14px;font-weight:600}
    .rec-btn-cancel:hover{text-decoration:underline}
    .rec-btn-send{width:40px;height:40px;border-radius:50%;background:var(--sup-success);border:none;color:#fff;cursor:pointer;display:flex;justify-content:center;align-items:center;font-size:16px}

    .lightbox-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(15,23,42,0.95);z-index:2000;display:none;justify-content:center;align-items:center;padding:20px}
    .lightbox-overlay.active{display:flex}
    .lightbox-img{max-width:90%;max-height:90vh;border-radius:8px;object-fit:contain}
    .lightbox-close{position:absolute;top:25px;left:25px;background:rgba(255,255,255,0.15);border:none;color:#fff;font-size:24px;width:50px;height:50px;border-radius:50%;cursor:pointer;display:flex;justify-content:center;align-items:center}

    #file-image-input,#file-audio-input,#file-doc-input{display:none}
    .loading-spinner{display:inline-block;width:14px;height:14px;border:2px solid rgba(255,255,255,0.3);border-radius:50%;border-top-color:#fff;animation:supSpin 1s linear infinite;vertical-align:middle;margin-left:6px}
    @keyframes supSpin{to{transform:rotate(360deg)}}

    @media(max-width:768px){
      .sidebar{width:100%;position:absolute;top:0;right:0;z-index:10}
      .sidebar.hidden{display:none}
      .chat-pane{width:100%}
      .back-btn{display:flex}
    }
  </style>
</head>
<body>

<div id="support-root">

<div class="offline-screen" id="offline-screen">
  <div class="offline-content">
    <div class="offline-icon-wrapper">
      <svg width="45" height="45" viewBox="0 0 24 24" fill="none" stroke="#B3432B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="1" y1="1" x2="23" y2="23"></line><path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55"></path>
        <path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39"></path><path d="M10.71 5.05A16 16 0 0 1 22.56 9"></path>
        <path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88"></path><path d="M8.53 16.11a6 6 0 0 1 6.95 0"></path>
        <line x1="12" y1="20" x2="12.01" y2="20"></line>
      </svg>
    </div>
    <h2 class="offline-title">لا يتوفر اتصال بالإنترنت</h2>
    <p class="offline-sub">يرجى التحقق من اتصال الشبكة. سنعيد توصيلك تلقائياً.</p>
    <div class="offline-loader">
      <span class="offline-dot"></span><span class="offline-dot"></span><span class="offline-dot"></span>
    </div>
  </div>
</div>

<!-- DASHBOARD -->
<div class="support-shell" id="support-shell" style="display:none;">
  <nav class="admin-nav" id="adminNav"></nav>

  <div class="dashboard-container" id="admin-dashboard-div">

    <div class="sidebar" id="dashboard-sidebar">
      <div class="sidebar-header">
        <div class="admin-profile">
          <div class="admin-avatar">A</div>
          <div>
            <div class="admin-name-txt">المسؤول</div>
            <div class="admin-role">محادثات الدعم الفني</div>
          </div>
        </div>
      </div>
      <div class="conv-list" id="conversations-list-container"></div>
    </div>

    <div class="chat-pane" id="dashboard-chat-pane">
      <div class="chat-placeholder" id="chat-placeholder-el">
        <i class="fa-solid fa-comments"></i>
        <h2>لوحة محادثات الدعم الفني</h2>
        <p>اختر مستخدماً من القائمة للرد عليه.</p>
      </div>

      <div class="chat-header">
        <button class="back-btn" id="back-to-list-btn">
          <i class="fa-solid fa-chevron-right"></i>
        </button>
        <div class="header-user-info">
          <div class="header-avatar" id="chat-header-avatar">M</div>
          <div class="header-user-details">
            <span class="header-name" id="chat-header-name">اسم المستخدم</span>
            <span class="header-user-status" id="chat-header-status">غير متصل</span>
          </div>
        </div>
      </div>

      <div class="chat-messages" id="chat-messages-container"></div>

      <div class="chat-input-bar">
        <div class="recording-overlay" id="voice-rec-overlay">
          <div class="rec-status">
            <div class="rec-dot"></div>
            <span class="rec-timer" id="rec-duration">00:00</span>
            <div class="rec-waves">
              <div class="rec-wave-bar"></div><div class="rec-wave-bar"></div>
              <div class="rec-wave-bar"></div><div class="rec-wave-bar"></div>
            </div>
          </div>
          <div class="rec-actions">
            <button class="rec-btn-cancel" id="btn-cancel-recording">إلغاء</button>
            <button class="rec-btn-send" id="btn-send-recording">
              <i class="fa-solid fa-paper-plane"></i>
            </button>
          </div>
        </div>

        <button class="input-attachment-btn" id="attach-trigger-btn">
          <i class="fa-solid fa-paperclip"></i>
        </button>
        <div class="attachment-menu" id="attachment-popup-menu">
          <div class="attach-item image-item" id="attach-image-btn"><i class="fa-solid fa-image"></i>إرفاق صورة</div>
          <div class="attach-item audio-item" id="attach-audio-btn"><i class="fa-solid fa-file-audio"></i>إرفاق ملف صوتي</div>
          <div class="attach-item doc-item" id="attach-doc-btn"><i class="fa-solid fa-file-lines"></i>إرفاق ملف / مستند</div>
          <div class="size-note">📎 صور وصوت: حتى 2MB — ملفات: حتى 500KB</div>
        </div>

        <div class="chat-input-wrapper">
          <textarea id="chat-text-input" placeholder="اكتب ردك هنا..." rows="1"></textarea>
        </div>
        <button class="send-msg-btn" id="voice-record-trigger">
          <i class="fa-solid fa-microphone" id="mic-icon"></i>
        </button>
      </div>
    </div>
  </div>
</div>

<input type="file" id="file-image-input" accept="image/*">
<input type="file" id="file-audio-input" accept="audio/*">
<input type="file" id="file-doc-input" accept=".pdf,.doc,.docx,.txt,.zip,.rar">

<div class="lightbox-overlay" id="image-lightbox">
  <button class="lightbox-close" id="close-lightbox"><i class="fa-solid fa-xmark"></i></button>
  <img class="lightbox-img" id="lightbox-img-el" src="" alt="">
</div>

</div><!-- /#support-root -->

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="icons.js"></script>
<script src="admin-shell.js"></script>
<script>
  /* نظام الدعم الفني يستخدم الآن نفس قاعدة بيانات واجهة المسؤول
     (نفس مشروع Firebase المُعرَّف في firebase-config.js)، بدل مشروع
     منفصل كما كان سابقاً. المتغيّر db أدناه هو نفسه db الذي أنشأه
     firebase-config.js عبر Firebase compat SDK (firebase.database()). */

  // ============================================================
  // ✅ رفع الملفات — Base64 في Firebase Realtime Database
  // مجاني 100% بدون Firebase Storage
  // ============================================================
  const LIMITS = { image: 2*1024*1024, audio: 2*1024*1024, voice: 2*1024*1024, file: 500*1024 };

  function fileToBase64(file) {
    return new Promise((res, rej) => {
      const r = new FileReader();
      r.readAsDataURL(file);
      r.onload  = () => res(r.result);
      r.onerror = () => rej(new Error('فشل قراءة الملف'));
    });
  }

  async function toBase64(file, type) {
    const limit = LIMITS[type] || LIMITS.file;
    if (file.size > limit) throw new Error(`الحد الأقصى ${(limit/1024/1024).toFixed(1)}MB`);
    return await fileToBase64(file);
  }

  // DOM
  const $ = id => document.getElementById(id);
  const supportShell              = $('support-shell');
  const dashboardDiv              = $('admin-dashboard-div');
  const dashboardSidebar          = $('dashboard-sidebar');
  const conversationsListContainer= $('conversations-list-container');
  const chatPlaceholderEl         = $('chat-placeholder-el');
  const chatHeaderName            = $('chat-header-name');
  const chatHeaderAvatar          = $('chat-header-avatar');
  const chatHeaderStatus          = $('chat-header-status');
  const chatMessagesContainer     = $('chat-messages-container');
  const chatTextInput             = $('chat-text-input');
  const micIcon                   = $('mic-icon');
  const offlineScreen             = $('offline-screen');
  const attachmentPopupMenu       = $('attachment-popup-menu');
  const voiceRecOverlay           = $('voice-rec-overlay');
  const recDuration               = $('rec-duration');
  const imageLightbox             = $('image-lightbox');
  const lightboxImgEl             = $('lightbox-img-el');

  let selectedUserId   = null;
  let selectedUserName = '';
  let mediaRecorder    = null;
  let audioChunks      = [];
  let recordTimer      = null;
  let recordStartTime  = 0;
  let activeVoicePlayers = {};
  let localStream      = null;
  let currentMimeType  = '';
  let usersStatusUnsub = null;
  let chatMsgsUnsub    = null;

  // ----- Offline -----
  function checkOnline() {
    navigator.onLine ? offlineScreen.classList.remove('active') : offlineScreen.classList.add('active');
  }
  window.addEventListener('online',  checkOnline);
  window.addEventListener('offline', checkOnline);
  checkOnline();

  // ----- الدخول: يعتمد على نفس نظام دخول المسؤول المستخدم في باقي لوحة
  // التحكم (Firebase Auth + isAdmin) — بدون اسم مستخدم/كلمة سر منفصلة هنا.
  requireAdminAuth(function () {
    supportShell.style.display = 'flex';
    dashboardDiv.classList.add('active'); // كانت مفقودة، وبسببها الصفحة تظهر فارغة تماماً بعد الدخول
    document.body.classList.add('chat-active');
    renderAdminNav('support');
    listenConversations();
  });

  // ----- UI -----
  $('attach-trigger-btn').addEventListener('click', e => { e.stopPropagation(); attachmentPopupMenu.classList.toggle('active'); });
  document.addEventListener('click', () => attachmentPopupMenu.classList.remove('active'));
  $('back-to-list-btn').addEventListener('click', () => {
    dashboardSidebar.classList.remove('hidden');
    chatPlaceholderEl.style.display = 'flex';
    selectedUserId = null;
    if (chatMsgsUnsub) chatMsgsUnsub();
  });
  $('close-lightbox').addEventListener('click', () => imageLightbox.classList.remove('active'));
  function openLightbox(src) { lightboxImgEl.src = src; imageLightbox.classList.add('active'); }

  // ----- Conversations -----
  function listenConversations() {
    db.ref('conversations').on('value', snap => {
      conversationsListContainer.innerHTML = '';
      if (!snap.exists()) {
        conversationsListContainer.innerHTML = `<div class="no-conv-msg"><i class="fa-solid fa-inbox" style="font-size:30px;margin-bottom:10px;display:block;opacity:0.5"></i>لا توجد رسائل واردة حالياً.</div>`;
        return;
      }
      const list = [];
      snap.forEach(c => list.push(c.val()));
      list.sort((a,b) => b.lastMessageTimestamp - a.lastMessageTimestamp);
      list.forEach(renderConvItem);
    });
  }

  function renderConvItem(conv) {
    const item = document.createElement('div');
    item.className = `conv-item ${selectedUserId === conv.userId ? 'active' : ''}`;
    const initial = (conv.userName || '').trim()[0] || 'U';
    const badge   = conv.unreadCountByAdmin > 0 ? `<span class="unread-badge">${conv.unreadCountByAdmin}</span>` : '';
    const time    = new Date(conv.lastMessageTimestamp).toLocaleTimeString('ar-EG',{hour:'2-digit',minute:'2-digit'});
    item.innerHTML = `
      <div class="user-avatar">${initial}</div>
      <div class="conv-details">
        <div class="conv-row"><span class="conv-name">${conv.userName}</span><span class="conv-time">${time}</span></div>
        <div class="conv-row"><span class="conv-last-msg">${conv.lastMessage}</span>${badge}</div>
      </div>`;
    item.addEventListener('click', () => {
      document.querySelectorAll('.conv-item').forEach(el => el.classList.remove('active'));
      item.classList.add('active');
      openChat(conv.userId, conv.userName);
    });
    conversationsListContainer.appendChild(item);
  }

  // ----- Open Chat -----
  function openChat(userId, userName) {
    selectedUserId   = userId;
    selectedUserName = userName;
    chatPlaceholderEl.style.display = 'none';
    if (window.innerWidth <= 768) dashboardSidebar.classList.add('hidden');
    chatHeaderName.textContent   = userName;
    chatHeaderAvatar.textContent = userName.trim()[0];
    chatHeaderStatus.className   = 'header-user-status';
    chatHeaderStatus.textContent = 'غير متصل';

    if (usersStatusUnsub) usersStatusUnsub();
    {
      const userStatusRef = db.ref(`users/${userId}`);
      const userStatusCb = snap => {
        if (snap.exists()) {
          const s = snap.val().status === 'online';
          chatHeaderStatus.textContent = s ? 'نشط الآن' : 'غير متصل';
          chatHeaderStatus.classList.toggle('online', s);
        }
      };
      userStatusRef.on('value', userStatusCb);
      usersStatusUnsub = () => userStatusRef.off('value', userStatusCb);
    }

    db.ref(`conversations/${userId}`).update({ unreadCountByAdmin: 0 });
    listenMessages(userId);
  }

  // ----- Textarea -----
  chatTextInput.addEventListener('input', function() {
    this.style.height = 'auto';
    this.style.height = (this.scrollHeight-10)+'px';
    micIcon.className = this.value.trim() ? 'fa-solid fa-paper-plane' : 'fa-solid fa-microphone';
  });

  // ----- Send Message -----
  async function sendMessage(type, text='', fileUrl='', fileName='') {
    if (!selectedUserId) return;
    if (!navigator.onLine) { alert('لا يوجد اتصال بالإنترنت'); return; }
    const msgId = db.ref().push().key;
    await db.ref(`messages/${selectedUserId}/${msgId}`).set({ id:msgId, sender:'admin', text, type, timestamp:Date.now(), fileUrl, fileName });
    const snippets = { text, image:'📷 صورة', voice:'🎤 رسالة صوتية', audio:'🎵 ملف صوتي', file:'📁 ملف مرفق' };
    const cr = db.ref(`conversations/${selectedUserId}`);
    const cs = await cr.once('value');
    const unread = ((cs.exists()?cs.val().unreadCountByUser:0)||0)+1;
    await cr.set({ userId:selectedUserId, userName:selectedUserName, lastMessage:snippets[type]||text, lastMessageTimestamp:Date.now(), unreadCountByAdmin:0, unreadCountByUser:unread });
  }

  $('voice-record-trigger').addEventListener('click', () => {
    const txt = chatTextInput.value.trim();
    if (txt) {
      sendMessage('text', txt);
      chatTextInput.value = ''; chatTextInput.style.height = 'auto';
      micIcon.className = 'fa-solid fa-microphone';
    } else {
      startRecording();
    }
  });

  // ----- Placeholder -----
  function renderPlaceholder(id, txt) {
    const d = document.createElement('div');
    d.id = id; d.className = 'msg-group admin';
    d.innerHTML = `<div class="message" style="opacity:0.7;font-style:italic"><span class="loading-spinner"></span> ${txt}</div>`;
    chatMessagesContainer.appendChild(d);
    chatMessagesContainer.scrollTop = chatMessagesContainer.scrollHeight;
  }

  // ----- Voice Recording -----
  function stopTracks() { if (localStream) { localStream.getTracks().forEach(t=>t.stop()); localStream=null; } }

  async function startRecording() {
    if (!navigator.onLine) { alert('لا يوجد اتصال'); return; }
    try {
      localStream = await navigator.mediaDevices.getUserMedia({ audio: true });
      const types = ['audio/webm;codecs=opus','audio/webm','audio/mp4','audio/ogg;codecs=opus','audio/ogg'];
      const mime  = types.find(t => MediaRecorder.isTypeSupported(t)) || '';
      mediaRecorder = new MediaRecorder(localStream, mime ? { mimeType: mime } : {});
      currentMimeType = mediaRecorder.mimeType;
      audioChunks = [];
      mediaRecorder.ondataavailable = e => { if (e.data.size > 0) audioChunks.push(e.data); };
      mediaRecorder.start(250);
      voiceRecOverlay.classList.add('active');
      recordStartTime = Date.now();
      recDuration.textContent = '00:00';
      recordTimer = setInterval(() => {
        const s = Math.floor((Date.now()-recordStartTime)/1000);
        recDuration.textContent = `${String(Math.floor(s/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`;
      }, 1000);
    } catch(err) { console.error(err); alert('لا يمكن الوصول للميكروفون — تأكد من إعطاء الصلاحية'); }
  }

  $('btn-cancel-recording').addEventListener('click', () => {
    clearInterval(recordTimer); voiceRecOverlay.classList.remove('active');
    if (mediaRecorder && mediaRecorder.state !== 'inactive') mediaRecorder.stop();
    stopTracks(); audioChunks = [];
  });

  $('btn-send-recording').addEventListener('click', () => {
    clearInterval(recordTimer); voiceRecOverlay.classList.remove('active');
    if (!mediaRecorder || mediaRecorder.state === 'inactive') return;
    mediaRecorder.onstop = async () => {
      stopTracks();
      if (!audioChunks.length) { alert('لم يتم التقاط صوت'); return; }
      let ext = 'webm';
      if (currentMimeType.includes('mp4')) ext = 'mp4';
      else if (currentMimeType.includes('ogg')) ext = 'ogg';
      const blob = new Blob(audioChunks, { type: currentMimeType || 'audio/webm' });
      const file = new File([blob], `admin_voice_${Date.now()}.${ext}`, { type: blob.type });
      const id   = 'tmp_v_'+Date.now();
      renderPlaceholder(id, 'جاري إرسال التسجيل...');
      try {
        const b64 = await toBase64(file, 'voice');
        $(id)?.remove();
        await sendMessage('voice', '', b64, file.name);
      } catch(err) { $(id)?.remove(); alert(err.message); }
    };
    mediaRecorder.stop();
  });

  // ----- Attachments -----
  $('attach-image-btn').addEventListener('click', () => { attachmentPopupMenu.classList.remove('active'); $('file-image-input').click(); });
  $('attach-audio-btn').addEventListener('click', () => { attachmentPopupMenu.classList.remove('active'); $('file-audio-input').click(); });
  $('attach-doc-btn').addEventListener('click',   () => { attachmentPopupMenu.classList.remove('active'); $('file-doc-input').click(); });

  async function handleFile(inputId, type) {
    const file = $(inputId).files[0]; if (!file) return;
    const labels = { image:'الصورة', audio:'الملف الصوتي', file:'الملف' };
    const id = 'tmp_'+type+'_'+Date.now();
    renderPlaceholder(id, `جاري إرسال ${labels[type]}...`);
    try {
      const b64 = await toBase64(file, type);
      $(id)?.remove();
      await sendMessage(type === 'file' ? 'file' : type, '', b64, file.name);
    } catch(err) { $(id)?.remove(); alert(err.message); }
    $(inputId).value = '';
  }

  $('file-image-input').addEventListener('change', () => handleFile('file-image-input','image'));
  $('file-audio-input').addEventListener('change', () => handleFile('file-audio-input','audio'));
  $('file-doc-input').addEventListener('change',   () => handleFile('file-doc-input','file'));

  // ----- Messages -----
  function listenMessages(userId) {
    if (chatMsgsUnsub) chatMsgsUnsub();
    const msgsRef = db.ref(`messages/${userId}`);
    const msgsCb = snap => {
      chatMessagesContainer.innerHTML = '';
      if (snap.exists()) {
        snap.forEach(c => renderMsg(c.val()));
        chatMessagesContainer.scrollTop = chatMessagesContainer.scrollHeight;
      }
    };
    msgsRef.on('value', msgsCb);
    chatMsgsUnsub = () => msgsRef.off('value', msgsCb);
  }

  function renderMsg(msg) {
    const isUser = msg.sender === 'user';
    const group  = document.createElement('div');
    group.className = `msg-group ${isUser ? 'user' : 'admin'}`;
    const msgDiv = document.createElement('div');
    msgDiv.className = 'message';

    if (msg.type === 'text') {
      msgDiv.innerText = msg.text;
    } else if (msg.type === 'image') {
      const img = document.createElement('img');
      img.src = msg.fileUrl; img.className = 'msg-img'; img.loading = 'lazy'; img.alt = 'صورة';
      img.addEventListener('click', () => openLightbox(msg.fileUrl));
      msgDiv.appendChild(img);
    } else if (msg.type === 'voice' || msg.type === 'audio') {
      msgDiv.appendChild(buildPlayer(msg.fileUrl, msg.id));
    } else if (msg.type === 'file') {
      const a = document.createElement('a');
      a.href = msg.fileUrl; a.download = msg.fileName||'file'; a.target = '_blank';
      a.className = 'msg-file-download';
      a.innerHTML = `<i class="fa-solid fa-file-arrow-down"></i>
        <div><div class="file-name-txt">${msg.fileName||'ملف مرفق'}</div>
        <span style="font-size:10px;opacity:0.6">اضغط للتحميل</span></div>`;
      msgDiv.appendChild(a);
    }

    const time = document.createElement('span');
    time.className = 'msg-time';
    time.textContent = new Date(msg.timestamp).toLocaleTimeString('ar-EG',{hour:'2-digit',minute:'2-digit'});
    group.appendChild(msgDiv);
    group.appendChild(time);
    chatMessagesContainer.appendChild(group);
  }

  function buildPlayer(url, msgId) {
    const wrap = document.createElement('div');
    wrap.className = 'msg-voice-player';
    const playBtn = document.createElement('button');
    playBtn.className = 'voice-play-btn';
    playBtn.innerHTML = '<i class="fa-solid fa-play"></i>';
    const bar  = document.createElement('div'); bar.className  = 'voice-progress-bar';
    const fill = document.createElement('div'); fill.className = 'voice-progress-fill';
    bar.appendChild(fill);
    const timeEl = document.createElement('span'); timeEl.className = 'voice-time'; timeEl.textContent = '--:--';
    wrap.append(playBtn, bar, timeEl);

    const audio = new Audio(url);
    activeVoicePlayers[msgId] = audio;

    audio.addEventListener('loadedmetadata', () => { timeEl.textContent = fmt(audio.duration); });
    audio.addEventListener('error',          () => { timeEl.textContent = 'خطأ'; });
    playBtn.addEventListener('click', e => {
      e.stopPropagation();
      Object.values(activeVoicePlayers).forEach(a => { if (a !== audio) a.pause(); });
      audio.paused ? audio.play() : audio.pause();
    });
    audio.addEventListener('play',  () => { playBtn.innerHTML = '<i class="fa-solid fa-pause"></i>'; });
    audio.addEventListener('pause', () => { playBtn.innerHTML = '<i class="fa-solid fa-play"></i>'; });
    audio.addEventListener('ended', () => { playBtn.innerHTML = '<i class="fa-solid fa-play"></i>'; fill.style.width='0%'; timeEl.textContent=fmt(audio.duration); });
    audio.addEventListener('timeupdate', () => { fill.style.width=`${(audio.currentTime/audio.duration)*100}%`; timeEl.textContent=fmt(audio.currentTime); });
    bar.addEventListener('click', e => {
      const r = bar.getBoundingClientRect();
      audio.currentTime = (1-(e.clientX-r.left)/r.width)*audio.duration;
    });
    return wrap;
  }

  function fmt(s) {
    if (!s||isNaN(s)) return '00:00';
    return `${String(Math.floor(s/60)).padStart(2,'0')}:${String(Math.floor(s%60)).padStart(2,'0')}`;
  }
</script>
</body>
</html>
