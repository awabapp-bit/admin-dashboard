<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5">
  <title>الدعم الفني — لوحة تحكم أواب</title>
  <link rel="icon" href="logo.png">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="style.css">
  <script>(function(){try{var t=localStorage.getItem('adminTheme');if(t==='dark'||(!t&&window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches)){document.documentElement.setAttribute('data-theme','dark');}}catch(e){}})();</script>
  <style>
    /* ===== متغيرات خاصة بالدعم الفني ===== */
    :root {
      --sup-bg-gradient: linear-gradient(135deg, var(--bg) 0%, #eef1f6 50%, #e4e8f0 100%);
      --sup-card-bg: rgba(255,255,255,0.7);
      --sup-card-border: var(--border);
      --sup-primary: var(--primary);
      --sup-primary-hover: var(--primary-dark);
      --sup-primary-glow: rgba(29,78,216,0.15);
      --sup-accent: var(--gold);
      --sup-text: var(--text);
      --sup-text-muted: var(--text-muted);
      --sup-danger: var(--danger);
      --sup-success: var(--success);
      --sup-message-admin: linear-gradient(135deg, var(--primary) 0%, var(--primary-navy) 100%);
      --sup-message-user: #f1f5f9;
      --sup-input-bg: #ffffff;
      --sup-input-border: var(--border);
      --sup-dropdown-bg: rgba(255,255,255,0.97);
      --sup-hover-bg: rgba(29,78,216,0.06);
      --sup-chat-messages-bg: rgba(243,245,249,0.6);
      --sup-recording-bg: rgba(255,255,255,0.98);
      --sup-sidebar-bg: rgba(243,245,249,0.92);
      --sup-offline-bg: rgba(243,245,249,0.92);
      --sup-offline-card-bg: rgba(255,255,255,0.85);
      --sup-chatpane-bg: rgba(255,255,255,0.1);
      --sup-placeholder-bg: rgba(243,245,249,0.95);
      --sup-bar-bg: rgba(255,255,255,0.45);
      --sup-user-avatar-bg: rgba(0,0,0,0.04);
      --sup-user-avatar-border: rgba(0,0,0,0.06);
      --sup-scrollbar-thumb: rgba(0,0,0,0.08);
      --sup-active-tint-bg: rgba(29,78,216,0.1);
      --sup-active-tint-border: rgba(29,78,216,0.2);
      --sup-delete-btn-bg: rgba(217,45,32,0.08);
      --sup-delete-btn-hover: rgba(217,45,32,0.18);
    }
    :root[data-theme="dark"] {
      --sup-bg-gradient: linear-gradient(135deg, var(--bg) 0%, #0d1426 50%, #0a0f1f 100%);
      --sup-card-bg: rgba(19,27,48,0.7);
      --sup-primary-glow: rgba(102,153,255,0.2);
      --sup-message-user: var(--border-soft);
      --sup-input-bg: #0F1728;
      --sup-dropdown-bg: rgba(19,27,48,0.97);
      --sup-hover-bg: rgba(102,153,255,0.12);
      --sup-chat-messages-bg: rgba(6,10,20,0.6);
      --sup-recording-bg: rgba(19,27,48,0.98);
      --sup-sidebar-bg: rgba(16,23,42,0.92);
      --sup-offline-bg: rgba(6,10,20,0.92);
      --sup-offline-card-bg: rgba(19,27,48,0.85);
      --sup-chatpane-bg: rgba(255,255,255,0.03);
      --sup-placeholder-bg: rgba(6,10,20,0.95);
      --sup-bar-bg: rgba(19,27,48,0.45);
      --sup-user-avatar-bg: rgba(255,255,255,0.06);
      --sup-user-avatar-border: rgba(255,255,255,0.1);
      --sup-scrollbar-thumb: rgba(255,255,255,0.14);
      --sup-active-tint-bg: rgba(102,153,255,0.14);
      --sup-active-tint-border: rgba(102,153,255,0.28);
      --sup-delete-btn-bg: rgba(240,100,90,0.15);
      --sup-delete-btn-hover: rgba(240,100,90,0.3);
    }

    #support-root * { box-sizing: border-box; }
    #support-root { font-family: 'Cairo', sans-serif; }
    body.chat-active { overflow: hidden; }

    .support-shell {
      display: flex;
      flex-direction: column;
      height: 100vh;
      height: 100dvh;
      overflow-x: hidden;
    }

    /* ===== Offline Screen ===== */
    .offline-screen {
      position: fixed; top:0; left:0; width:100%; height:100%;
      background: var(--sup-offline-bg);
      backdrop-filter: blur(25px);
      z-index: 99999;
      display: flex;
      justify-content: center;
      align-items: center;
      opacity: 0;
      pointer-events: none;
      transform: scale(1.08);
      transition: all 0.5s cubic-bezier(0.34,1.56,0.64,1);
    }
    .offline-screen.active { opacity:1; pointer-events:all; transform:scale(1); }
    .offline-content {
      text-align:center; padding:40px; max-width:420px; width:90%;
      background: var(--sup-offline-card-bg);
      border:1px solid var(--sup-card-border);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow);
    }
    .offline-icon-wrapper {
      width:100px; height:100px; border-radius:50%;
      background:rgba(217,45,32,0.1);
      display:flex; justify-content:center; align-items:center;
      margin:0 auto 25px; position:relative;
    }
    .offline-icon-wrapper::after {
      content:''; position:absolute; width:100%; height:100%;
      border-radius:50%; border:2px solid rgba(217,45,32,0.3);
      animation: supPulseGlow 2s infinite;
    }
    @keyframes supPulseGlow { 0%{transform:scale(1);opacity:1} 100%{transform:scale(1.4);opacity:0} }
    .offline-title { font-size:1.375rem; font-weight:800; color:var(--sup-text); margin-bottom:12px; }
    .offline-sub { font-size:0.875rem; color:var(--sup-text-muted); line-height:1.6; margin-bottom:25px; }
    .offline-loader { display:flex; justify-content:center; gap:8px; }
    .offline-dot {
      width:8px; height:8px; border-radius:50%; background:var(--sup-danger);
      animation: supJump 1.2s infinite alternate;
    }
    .offline-dot:nth-child(2) { animation-delay:0.2s; }
    .offline-dot:nth-child(3) { animation-delay:0.4s; }
    @keyframes supJump { 0%{transform:translateY(0)} 100%{transform:translateY(-8px)} }

    /* ===== Dashboard Container ===== */
    .dashboard-container {
      display: none;
      width: auto;
      flex: 1;
      min-height: 0;
      position: relative;
      max-width: 100%;
    }
    .dashboard-container.active { display: flex; }
    @media (min-width:861px) {
      .dashboard-container { margin-right: var(--sidebar-w); transition: margin-right .25s ease; }
      body.sidebar-collapsed .dashboard-container { margin-right: var(--sidebar-w-collapsed); }
    }

    /* ===== Sidebar (قائمة المحادثات) ===== */
    .sidebar {
      width: 380px;
      border-left: 1px solid var(--sup-card-border);
      background: var(--sup-sidebar-bg);
      backdrop-filter: blur(20px);
      display: flex;
      flex-direction: column;
      height: 100%;
      transition: transform 0.25s ease;
    }
    .sidebar-header {
      padding: 18px 25px;
      border-bottom: 1px solid var(--sup-card-border);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .admin-profile { display: flex; align-items: center; gap: 12px; }
    .admin-avatar {
      width:40px; height:40px; border-radius:50%;
      background:var(--sup-primary);
      display:flex; justify-content:center; align-items:center;
      font-size:1.125rem; font-weight:bold; color:#fff;
    }
    .admin-name-txt { font-weight:700; font-size:0.9375rem; color:var(--sup-text); }
    .admin-role { font-size:0.6875rem; color:var(--sup-accent); }
    .sidebar-close-mobile {
      display: none;
      background: none;
      border: none;
      color: var(--sup-text-muted);
      font-size:1.375rem;
      cursor: pointer;
      padding: 4px 8px;
    }
    .conv-list {
      flex: 1;
      overflow-y: auto;
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .conv-list::-webkit-scrollbar { width:5px; }
    .conv-list::-webkit-scrollbar-thumb { background:var(--sup-scrollbar-thumb); border-radius:3px; }

    /* ===== عنصر المحادثة ===== */
    .conv-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 16px;
      border-radius: 16px;
      cursor: pointer;
      position: relative;
      transition: background 0.15s;
    }
    .conv-item:hover { background: var(--sup-hover-bg); }
    .conv-item.active {
      background: var(--sup-active-tint-bg);
      border: 1px solid var(--sup-active-tint-border);
    }
    .user-avatar {
      width: 46px; height: 46px; border-radius: 50%;
      background: var(--sup-user-avatar-bg);
      border: 1px solid var(--sup-user-avatar-border);
      display: flex; justify-content: center; align-items: center;
      font-size:1.125rem; color: var(--sup-primary); flex-shrink: 0;
    }
    .conv-details { flex: 1; min-width: 0; }
    .conv-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      margin-bottom: 4px;
    }
    .conv-name {
      font-weight: 700;
      font-size:0.875rem;
      color: var(--sup-text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .conv-time {
      font-size:0.6875rem;
      color: var(--sup-text-muted);
      white-space: nowrap;
    }
    .conv-last-msg {
      font-size:0.8125rem;
      color: var(--sup-text-muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      flex: 1;
    }
    .unread-badge {
      background: var(--sup-danger);
      color: #fff;
      font-size:0.625rem;
      font-weight: bold;
      min-width: 18px;
      height: 18px;
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 0 4px;
    }
    .conv-delete-btn {
      background: var(--sup-delete-btn-bg);
      border: none;
      color: var(--sup-danger);
      width: 28px;
      height: 28px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
      transition: background 0.15s;
      font-size:0.8125rem;
    }
    .conv-delete-btn:hover { background: var(--sup-delete-btn-hover); }
    .no-conv-msg {
      text-align: center;
      color: var(--sup-text-muted);
      padding: 40px 20px;
      font-size:0.875rem;
    }

    /* ===== Chat Pane ===== */
    .chat-pane {
      flex: 1;
      display: flex;
      flex-direction: column;
      height: 100%;
      background: var(--sup-chatpane-bg);
      position: relative;
    }
    .chat-placeholder {
      position: absolute;
      top:0; left:0; width:100%; height:100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 15px;
      color: var(--sup-text-muted);
      z-index: 5;
      background: var(--sup-placeholder-bg);
      padding: 20px;
    }
    .chat-placeholder i {
      font-size:3.75rem;
      background: linear-gradient(135deg, var(--sup-primary), var(--sup-accent));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      opacity: 0.8;
    }
    .chat-placeholder .open-sidebar-btn {
      background: var(--sup-primary);
      color: #fff;
      border: none;
      padding: 12px 24px;
      border-radius: var(--radius-sm);
      font-size:1rem;
      font-weight: 700;
      cursor: pointer;
      display: none; /* مخفي على سطح المكتب، يظهر فقط على الموبايل */
      box-shadow: 0 4px 12px var(--sup-primary-glow);
    }
    .chat-placeholder .open-sidebar-btn:hover { background: var(--sup-primary-hover); }

    /* ===== Chat Header ===== */
    .chat-header {
      padding: 12px 16px;
      background: var(--sup-bar-bg);
      border-bottom: 1px solid var(--sup-card-border);
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .back-btn {
      display: none;
      background: none;
      border: none;
      color: var(--sup-text);
      font-size:1.25rem;
      cursor: pointer;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      justify-content: center;
      align-items: center;
      flex-shrink: 0;
    }
    .back-btn:hover { background: var(--sup-hover-bg); }
    .header-user-info {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
      flex: 1;
    }
    .header-avatar {
      width: 40px; height: 40px; border-radius: 50%;
      background: var(--sup-hover-bg);
      border: 1px solid var(--sup-card-border);
      display: flex; justify-content: center; align-items: center;
      font-size:1rem; color: var(--sup-primary); flex-shrink: 0;
    }
    .header-user-details {
      display: flex;
      flex-direction: column;
      min-width: 0;
    }
    .header-name {
      font-weight: 700;
      font-size:0.9375rem;
      color: var(--sup-text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .header-user-status {
      font-size:0.6875rem;
      color: var(--sup-text-muted);
    }
    .header-user-status.online { color: var(--sup-success); }

    .header-delete-chat-btn {
      background: var(--sup-delete-btn-bg);
      border: none;
      color: var(--sup-danger);
      width: 36px;
      height: 36px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
      font-size:1rem;
      transition: background 0.15s;
    }
    .header-delete-chat-btn:hover { background: var(--sup-delete-btn-hover); }

    /* ===== Messages ===== */
    .chat-messages {
      flex: 1;
      padding: 16px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
      background: var(--sup-chat-messages-bg);
    }
    .chat-messages::-webkit-scrollbar { width: 6px; }
    .chat-messages::-webkit-scrollbar-thumb { background: var(--sup-scrollbar-thumb); border-radius:3px; }

    .msg-group {
      display: flex;
      flex-direction: column;
      max-width: 82%;
    }
    .msg-group.admin { align-self: flex-start; align-items: flex-end; }
    .msg-group.user { align-self: flex-end; align-items: flex-start; }
    .message {
      padding: 10px 14px;
      border-radius: 18px;
      font-size:0.875rem;
      line-height: 1.6;
      word-break: break-word;
    }
    .msg-group.admin .message {
      background: var(--sup-message-admin);
      color: #fff;
      border-top-left-radius: 2px;
      box-shadow: 0 4px 12px var(--sup-primary-glow);
    }
    .msg-group.user .message {
      background: var(--sup-message-user);
      color: var(--sup-text);
      border-top-right-radius: 2px;
      border: 1px solid var(--sup-card-border);
    }
    .msg-time {
      font-size:0.625rem;
      color: var(--sup-text-muted);
      margin-top: 4px;
      padding: 0 5px;
    }

    .msg-img {
      max-width: 100%;
      max-height: 220px;
      border-radius: 12px;
      cursor: pointer;
      display: block;
    }
    .msg-img:hover { opacity: 0.9; }

    .msg-voice-player {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 180px;
      padding: 4px 0;
    }
    .voice-play-btn {
      width: 34px; height: 34px; border-radius: 50%;
      background: rgba(255,255,255,0.2);
      border: none; color: #fff; cursor: pointer;
      display: flex; justify-content: center; align-items: center;
      font-size:0.8125rem; flex-shrink: 0;
    }
    .msg-group.user .voice-play-btn {
      background: var(--sup-hover-bg);
      color: var(--sup-text);
    }
    .voice-progress-bar {
      flex: 1; height: 4px;
      background: rgba(255,255,255,0.2);
      border-radius: 2px;
      position: relative;
      cursor: pointer;
    }
    .msg-group.user .voice-progress-bar { background: var(--sup-scrollbar-thumb); }
    .voice-progress-fill {
      height: 100%; width: 0%;
      background: #fff;
      border-radius: 2px;
      position: absolute; top:0; right:0;
    }
    .msg-group.user .voice-progress-fill { background: var(--sup-primary); }
    .voice-time {
      font-size:0.6875rem; color: #fff; min-width: 35px;
    }
    .msg-group.user .voice-time { color: var(--sup-text); }

    .msg-file-download {
      display: flex;
      align-items: center;
      gap: 10px;
      background: rgba(255,255,255,0.1);
      padding: 8px 12px;
      border-radius: 12px;
      text-decoration: none;
      color: #fff;
      font-size:0.8125rem;
      border: 1px solid rgba(255,255,255,0.1);
    }
    .msg-group.user .msg-file-download {
      background: var(--sup-hover-bg);
      color: var(--sup-text);
      border-color: var(--sup-card-border);
    }
    .msg-file-download:hover { opacity: 0.85; }
    .file-name-txt {
      max-width: 130px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* ===== Chat Input Bar ===== */
    .chat-input-bar {
      padding: 12px 16px;
      background: var(--sup-bar-bg);
      border-top: 1px solid var(--sup-card-border);
      display: flex;
      align-items: center;
      gap: 10px;
      position: relative;
    }
    .chat-input-wrapper {
      flex: 1;
      display: flex;
      align-items: center;
      background: var(--sup-input-bg);
      border: 1px solid var(--sup-input-border);
      border-radius: 16px;
      padding: 4px 12px;
    }
    .chat-input-wrapper:focus-within {
      border-color: var(--sup-primary);
      box-shadow: 0 0 15px var(--sup-primary-glow);
    }
    .chat-input-wrapper textarea {
      width: 100%;
      background: none;
      border: none;
      outline: none;
      color: var(--sup-text);
      font-size:0.875rem;
      resize: none;
      padding: 8px 0;
      height: 36px;
      max-height: 80px;
      line-height: 22px;
      font-family: 'Cairo', sans-serif;
    }
    .input-attachment-btn {
      background: none;
      border: none;
      color: var(--sup-text-muted);
      font-size:1.125rem;
      cursor: pointer;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      flex-shrink: 0;
    }
    .input-attachment-btn:hover {
      color: var(--sup-text);
      background: var(--sup-hover-bg);
    }
    .send-msg-btn {
      width: 44px;
      height: 44px;
      border-radius: 16px;
      background: var(--sup-primary);
      border: none;
      color: #fff;
      font-size:1.125rem;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      box-shadow: 0 5px 15px var(--sup-primary-glow);
      flex-shrink: 0;
    }
    .send-msg-btn:hover {
      background: var(--sup-primary-hover);
      transform: scale(1.05);
    }

    .attachment-menu {
      position: absolute;
      bottom: 80px;
      right: 16px;
      background: var(--sup-dropdown-bg);
      backdrop-filter: blur(15px);
      border: 1px solid var(--sup-card-border);
      border-radius: 16px;
      padding: 8px;
      display: none;
      flex-direction: column;
      gap: 5px;
      box-shadow: var(--shadow);
      z-index: 101;
      min-width: 180px;
    }
    .attachment-menu.active { display: flex; }
    .attach-item {
      padding: 10px 14px;
      border-radius: 10px;
      font-size:0.8125rem;
      color: var(--sup-text);
      display: flex;
      align-items: center;
      gap: 12px;
      cursor: pointer;
    }
    .attach-item:hover { background: var(--sup-hover-bg); }
    .attach-item.image-item i { color: var(--sup-accent); }
    .attach-item.audio-item i { color: var(--sup-primary); }
    .attach-item.doc-item i { color: var(--sup-success); }
    .size-note {
      font-size:0.6875rem;
      color: var(--sup-text-muted);
      padding: 4px 12px 6px;
      border-top: 1px solid var(--sup-card-border);
      margin-top: 3px;
    }

    /* ===== Recording Overlay ===== */
    .recording-overlay {
      position: absolute;
      top:0; left:0; width:100%; height:100%;
      background: var(--sup-recording-bg);
      display: none;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      z-index: 5;
    }
    .recording-overlay.active { display: flex; }
    .rec-status { display: flex; align-items: center; gap: 10px; }
    .rec-dot {
      width: 10px; height: 10px; border-radius: 50%;
      background: var(--sup-danger);
      animation: supPulse 1s infinite;
      box-shadow: 0 0 10px var(--sup-danger);
    }
    @keyframes supPulse { 0%,100%{opacity:1} 50%{opacity:0.5} }
    .rec-timer { font-size:0.875rem; font-weight:600; color:var(--sup-text); }
    .rec-waves { display:flex; align-items:center; gap:3px; height:20px; }
    .rec-wave-bar {
      width:3px; height:5px; background:var(--sup-primary);
      border-radius:3px; animation: supWave 1s ease-in-out infinite alternate;
    }
    .rec-wave-bar:nth-child(2) { animation-delay:0.2s; height:10px; }
    .rec-wave-bar:nth-child(3) { animation-delay:0.4s; height:15px; }
    .rec-wave-bar:nth-child(4) { animation-delay:0.6s; height:8px; }
    @keyframes supWave { 0%{height:5px} 100%{height:20px} }
    .rec-actions { display:flex; align-items:center; gap:12px; }
    .rec-btn-cancel {
      background:none; border:none; color:var(--sup-danger);
      cursor:pointer; font-size:0.875rem; font-weight:600;
    }
    .rec-btn-cancel:hover { text-decoration:underline; }
    .rec-btn-send {
      width:40px; height:40px; border-radius:50%;
      background:var(--sup-success); border:none; color:#fff;
      cursor:pointer; display:flex; justify-content:center; align-items:center;
      font-size:1rem;
    }

    /* ===== Lightbox ===== */
    .lightbox-overlay {
      position:fixed; top:0; left:0; right:0; bottom:0;
      background:rgba(15,23,42,0.95); z-index:2000;
      display:none; justify-content:center; align-items:center; padding:20px;
    }
    .lightbox-overlay.active { display:flex; }
    .lightbox-img { max-width:90%; max-height:90vh; border-radius:8px; object-fit:contain; }
    .lightbox-close {
      position:absolute; top:20px; left:20px;
      background:rgba(255,255,255,0.15); border:none; color:#fff;
      font-size:1.5rem; width:44px; height:44px; border-radius:50%;
      cursor:pointer; display:flex; justify-content:center; align-items:center;
    }

    /* ===== Hidden inputs ===== */
    #file-image-input, #file-audio-input, #file-doc-input { display: none; }

    /* ===== Loading spinner ===== */
    .loading-spinner {
      display:inline-block; width:14px; height:14px;
      border:2px solid rgba(255,255,255,0.3); border-radius:50%;
      border-top-color:#fff; animation:supSpin 1s linear infinite;
      vertical-align:middle; margin-left:6px;
    }
    @keyframes supSpin { to { transform:rotate(360deg); } }

    /* ===== Responsive ===== */
    @media (max-width: 860px) {
      .sidebar {
        position: absolute;
        top: 0;
        right: 0;
        bottom: 0;
        width: min(82vw, 320px);
        z-index: 20;
        transform: translateX(100%);
        transition: transform 0.28s ease;
        box-shadow: -6px 0 30px rgba(0,0,0,0.15);
      }
      .sidebar.open {
        transform: translateX(0);
      }
      .sidebar-close-mobile {
        display: flex;
      }
      .chat-pane { width: 100%; }
      .back-btn { display: flex; }

      .chat-placeholder .open-sidebar-btn {
        display: inline-flex; /* يظهر فقط على الموبايل */
      }

      .chat-header {
        padding: 10px 12px;
        gap: 8px;
      }
      .header-avatar { width: 36px; height: 36px; font-size:0.875rem; }
      .header-name { font-size:0.875rem; }
      .chat-messages { padding: 12px; }
      .msg-group { max-width: 88%; }
      .chat-input-bar {
        padding: 10px 12px;
        gap: 8px;
      }
      .chat-input-wrapper textarea { font-size:0.8125rem; height: 32px; }
      .send-msg-btn { width: 40px; height: 40px; font-size:1rem; }
      .input-attachment-btn { width: 32px; height: 32px; font-size:1rem; }
      .attachment-menu {
        right: 12px;
        bottom: 72px;
        min-width: 160px;
      }
      .conv-item { padding: 10px 12px; gap: 10px; }
      .user-avatar { width: 40px; height: 40px; font-size:1rem; }
      .conv-name { font-size:0.8125rem; }
      .conv-last-msg { font-size:0.75rem; }
      .conv-delete-btn { width: 26px; height: 26px; font-size:0.75rem; }
      .sidebar-header { padding: 14px 16px; }
    }

    @media (max-width: 420px) {
      .msg-group { max-width: 92%; }
      .message { font-size:0.8125rem; padding: 8px 12px; }
      .chat-messages { padding: 8px; gap: 10px; }
      .chat-input-bar { padding: 8px 10px; gap: 6px; }
      .chat-input-wrapper { padding: 2px 10px; }
      .chat-input-wrapper textarea { font-size:0.8125rem; height: 30px; }
      .send-msg-btn { width: 36px; height: 36px; font-size:0.875rem; }
      .input-attachment-btn { width: 30px; height: 30px; font-size:0.875rem; }
      .sidebar { width: 100%; }
      .conv-item { padding: 8px 10px; }
      .user-avatar { width: 36px; height: 36px; font-size:0.875rem; }
      .conv-name { font-size:0.75rem; }
      .conv-last-msg { font-size:0.6875rem; }
      .conv-delete-btn { width: 24px; height: 24px; font-size:0.6875rem; }
    }

    /* ===== Sidebar overlay for mobile ===== */
    .sidebar-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.4);
      z-index: 19;
      opacity: 0;
      transition: opacity 0.25s ease;
    }
    .sidebar-overlay.active {
      display: block;
      opacity: 1;
    }
    @media (max-width: 860px) {
      .sidebar-overlay.active { display: block; }
    }
  </style>
</head>

<!-- Firebase & Admin scripts -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="icons.js"></script>
<script src="admin-shell.js"></script>

<script>
  (function() {
    'use strict';

    // ============================================================
    // إعدادات رفع الملفات (Base64)
    // ============================================================
    const LIMITS = { image: 2*1024*1024, audio: 2*1024*1024, voice: 2*1024*1024, file: 500*1024 };

    function fileToBase64(file) {
      return new Promise((res, rej) => {
        const r = new FileReader();
        r.readAsDataURL(file);
        r.onload  = () => res(r.result);
        r.onerror = () => rej(new Error('فشل قراءة الملف'));
      });
    }

    async function toBase64(file, type) {
      const limit = LIMITS[type] || LIMITS.file;
      if (file.size > limit) throw new Error(`الحد الأقصى ${(limit/1024/1024).toFixed(1)}MB`);
      return await fileToBase64(file);
    }

    // ============================================================
    // DOM references
    // ============================================================
    const $ = id => document.getElementById(id);
    const supportShell              = $('support-shell');
    const dashboardDiv              = $('admin-dashboard-div');
    const dashboardSidebar          = $('dashboard-sidebar');
    const sidebarOverlay            = $('sidebar-overlay');
    const sidebarCloseMobile        = $('sidebar-close-mobile');
    const openSidebarMobileBtn      = $('open-sidebar-mobile-btn');
    const conversationsListContainer= $('conversations-list-container');
    const chatPlaceholderEl         = $('chat-placeholder-el');
    const chatHeaderName            = $('chat-header-name');
    const chatHeaderAvatar          = $('chat-header-avatar');
    const chatHeaderStatus          = $('chat-header-status');
    const chatMessagesContainer     = $('chat-messages-container');
    const chatTextInput             = $('chat-text-input');
    const micIcon                   = $('mic-icon');
    const offlineScreen             = $('offline-screen');
    const attachmentPopupMenu       = $('attachment-popup-menu');
    const voiceRecOverlay           = $('voice-rec-overlay');
    const recDuration               = $('rec-duration');
    const imageLightbox             = $('image-lightbox');
    const lightboxImgEl             = $('lightbox-img-el');
    const deleteChatBtn             = $('delete-chat-btn');
    const backToListBtn             = $('back-to-list-btn');

    // ============================================================
    // State
    // ============================================================
    let selectedUserId   = null;
    let selectedUserName = '';
    let mediaRecorder    = null;
    let audioChunks      = [];
    let recordTimer      = null;
    let recordStartTime  = 0;
    let activeVoicePlayers = {};
    let localStream      = null;
    let currentMimeType  = '';
    let usersStatusUnsub = null;
    let chatMsgsUnsub    = null;
    let conversationsListener = null;

    // ============================================================
    // Offline
    // ============================================================
    function checkOnline() {
      navigator.onLine ? offlineScreen.classList.remove('active') : offlineScreen.classList.add('active');
    }
    window.addEventListener('online',  checkOnline);
    window.addEventListener('offline', checkOnline);
    checkOnline();

    // ============================================================
    // Auth & Init
    // ============================================================
    requireAdminAuth(function () {
      supportShell.style.display = 'flex';
      dashboardDiv.classList.add('active');
      document.body.classList.add('chat-active');
      renderAdminNav('support');
      listenConversations();

      // على الموبايل، نفتح القائمة الجانبية تلقائياً إذا لم تكن هناك محادثة مفتوحة
      if (window.innerWidth <= 860 && !selectedUserId) {
        openSidebarMobile();
      }
    });

    // ============================================================
    // UI Helpers
    // ============================================================
    function openLightbox(src) {
      lightboxImgEl.src = src;
      imageLightbox.classList.add('active');
    }

    // ============================================================
    // Sidebar Mobile Toggle
    // ============================================================
    function openSidebarMobile() {
      dashboardSidebar.classList.add('open');
      sidebarOverlay.classList.add('active');
      // إخفاء زر الفتح في placeholder إذا كان ظاهراً
      if (openSidebarMobileBtn) openSidebarMobileBtn.style.display = 'none';
    }
    function closeSidebarMobile() {
      dashboardSidebar.classList.remove('open');
      sidebarOverlay.classList.remove('active');
      // إظهار زر الفتح في placeholder إذا كنا في وضع placeholder
      if (openSidebarMobileBtn && !selectedUserId) {
        openSidebarMobileBtn.style.display = 'inline-flex';
      }
    }
    sidebarCloseMobile.addEventListener('click', closeSidebarMobile);
    sidebarOverlay.addEventListener('click', closeSidebarMobile);
    // زر فتح القائمة من placeholder
    if (openSidebarMobileBtn) {
      openSidebarMobileBtn.addEventListener('click', openSidebarMobile);
    }

    // ============================================================
    // Conversations List
    // ============================================================
    function listenConversations() {
      if (conversationsListener) {
        db.ref('conversations').off('value', conversationsListener);
      }
      conversationsListener = snap => {
        conversationsListContainer.innerHTML = '';
        if (!snap.exists()) {
          conversationsListContainer.innerHTML = `
            <div class="no-conv-msg">
              <i class="fa-solid fa-inbox" style="font-size:1.875rem;margin-bottom:10px;display:block;opacity:0.5"></i>
              لا توجد رسائل واردة حالياً.
            </div>`;
          return;
        }

        const list = [];
        snap.forEach(child => {
          const data = child.val() || {};
          const userId = child.key;
          list.push({
            userId: userId,
            userName: data.userName || data.name || 'مستخدم',
            lastMessage: data.lastMessage || '...',
            lastMessageTimestamp: data.lastMessageTimestamp || 0,
            unreadCountByAdmin: data.unreadCountByAdmin || 0,
            unreadCountByUser: data.unreadCountByUser || 0,
            ...data
          });
        });

        list.sort((a, b) => (b.lastMessageTimestamp || 0) - (a.lastMessageTimestamp || 0));
        list.forEach(conv => renderConvItem(conv));
      };
      db.ref('conversations').on('value', conversationsListener, err => {
        conversationsListContainer.innerHTML = `
          <div class="no-conv-msg" style="color:var(--sup-danger)">
            <i class="fa-solid fa-triangle-exclamation" style="font-size:1.875rem;margin-bottom:10px;display:block;"></i>
            تعذّر تحميل المحادثات: ${escapeHtml(err.message || String(err))}
          </div>`;
      });
    }

    function renderConvItem(conv) {
      const item = document.createElement('div');
      item.className = `conv-item ${selectedUserId === conv.userId ? 'active' : ''}`;
      const initial = (conv.userName || 'U').trim()[0] || 'U';
      const badge = conv.unreadCountByAdmin > 0 ? `<span class="unread-badge">${conv.unreadCountByAdmin}</span>` : '';
      const time = conv.lastMessageTimestamp
        ? new Date(conv.lastMessageTimestamp).toLocaleTimeString('ar-EG', { hour: '2-digit', minute: '2-digit' })
        : '';

      item.innerHTML = `
        <div class="user-avatar">${initial}</div>
        <div class="conv-details">
          <div class="conv-row">
            <span class="conv-name">${escapeHtml(conv.userName)}</span>
            <span class="conv-time">${time}</span>
          </div>
          <div class="conv-row">
            <span class="conv-last-msg">${escapeHtml(conv.lastMessage || '...')}</span>
            ${badge}
          </div>
        </div>
        <button class="conv-delete-btn" data-userid="${conv.userId}" title="مسح المحادثة" aria-label="مسح المحادثة">
          <i class="fa-solid fa-trash-can"></i>
        </button>
      `;

      item.addEventListener('click', (e) => {
        if (e.target.closest('.conv-delete-btn')) return;
        document.querySelectorAll('.conv-item').forEach(el => el.classList.remove('active'));
        item.classList.add('active');
        openChat(conv.userId, conv.userName);
        if (window.innerWidth <= 860) {
          closeSidebarMobile();
        }
      });

      const deleteBtn = item.querySelector('.conv-delete-btn');
      deleteBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        const userId = deleteBtn.dataset.userid;
        deleteConversation(userId);
      });

      conversationsListContainer.appendChild(item);
    }

    // ============================================================
    // حذف المحادثة بالكامل
    // ============================================================
    function deleteConversation(userId) {
      if (!userId) return;
      const name = selectedUserId === userId ? selectedUserName : 'هذا المستخدم';
      if (!confirm(`هل تريد مسح محادثة "${name}" بالكامل؟\nسيتم حذف كل الرسائل ولا يمكن التراجع.`)) return;

      const updates = {};
      updates[`conversations/${userId}`] = null;
      updates[`messages/${userId}`] = null;

      db.ref().update(updates)
        .then(() => {
          showToast('✅ تم مسح المحادثة بنجاح', 'success');
          if (selectedUserId === userId) {
            closeCurrentChat();
          }
        })
        .catch(err => {
          showToast('❌ تعذر مسح المحادثة: ' + err.message, 'error');
        });
    }

    function closeCurrentChat() {
      if (chatMsgsUnsub) chatMsgsUnsub();
      if (usersStatusUnsub) usersStatusUnsub();
      selectedUserId = null;
      selectedUserName = '';
      chatPlaceholderEl.style.display = 'flex';
      chatMessagesContainer.innerHTML = '';
      chatHeaderName.textContent = 'اسم المستخدم';
      chatHeaderAvatar.textContent = 'M';
      chatHeaderStatus.className = 'header-user-status';
      chatHeaderStatus.textContent = 'غير متصل';
      document.querySelectorAll('.conv-item').forEach(el => el.classList.remove('active'));
      // إظهار زر فتح القائمة في placeholder إذا كنا على الموبايل
      if (window.innerWidth <= 860 && openSidebarMobileBtn) {
        openSidebarMobileBtn.style.display = 'inline-flex';
      }
    }

    // ============================================================
    // فتح المحادثة
    // ============================================================
    function openChat(userId, userName) {
      if (selectedUserId === userId) return;

      if (chatMsgsUnsub) chatMsgsUnsub();
      if (usersStatusUnsub) usersStatusUnsub();

      selectedUserId   = userId;
      selectedUserName = userName;
      chatPlaceholderEl.style.display = 'none';

      chatHeaderName.textContent   = userName;
      chatHeaderAvatar.textContent = userName.trim()[0] || 'U';
      chatHeaderStatus.className   = 'header-user-status';
      chatHeaderStatus.textContent = 'غير متصل';

      {
        const userStatusRef = db.ref(`users/${userId}`);
        const userStatusCb = snap => {
          if (snap.exists()) {
            const s = snap.val().status === 'online';
            chatHeaderStatus.textContent = s ? 'نشط الآن' : 'غير متصل';
            chatHeaderStatus.classList.toggle('online', s);
          }
        };
        userStatusRef.on('value', userStatusCb);
        usersStatusUnsub = () => userStatusRef.off('value', userStatusCb);
      }

      db.ref(`conversations/${userId}`).update({ unreadCountByAdmin: 0 });
      listenMessages(userId);
    }

    // ============================================================
    // Messages
    // ============================================================
    function listenMessages(userId) {
      if (chatMsgsUnsub) chatMsgsUnsub();
      const msgsRef = db.ref(`messages/${userId}`);
      const msgsCb = snap => {
        chatMessagesContainer.innerHTML = '';
        if (snap.exists()) {
          snap.forEach(c => renderMsg(c.val()));
          chatMessagesContainer.scrollTop = chatMessagesContainer.scrollHeight;
        }
      };
      msgsRef.on('value', msgsCb);
      chatMsgsUnsub = () => msgsRef.off('value', msgsCb);
    }

    function renderMsg(msg) {
      const isUser = msg.sender === 'user';
      const group  = document.createElement('div');
      group.className = `msg-group ${isUser ? 'user' : 'admin'}`;
      const msgDiv = document.createElement('div');
      msgDiv.className = 'message';

      if (msg.type === 'text') {
        msgDiv.innerText = msg.text;
      } else if (msg.type === 'image') {
        const img = document.createElement('img');
        img.src = msg.fileUrl; img.className = 'msg-img'; img.loading = 'lazy'; img.alt = 'صورة';
        img.addEventListener('click', () => openLightbox(msg.fileUrl));
        msgDiv.appendChild(img);
      } else if (msg.type === 'voice' || msg.type === 'audio') {
        msgDiv.appendChild(buildPlayer(msg.fileUrl, msg.id));
      } else if (msg.type === 'file') {
        const a = document.createElement('a');
        a.href = msg.fileUrl; a.download = msg.fileName||'file'; a.target = '_blank';
        a.className = 'msg-file-download';
        a.innerHTML = `<i class="fa-solid fa-file-arrow-down"></i>
          <div><div class="file-name-txt">${msg.fileName||'ملف مرفق'}</div>
          <span style="font-size:0.625rem;opacity:0.6">اضغط للتحميل</span></div>`;
        msgDiv.appendChild(a);
      }

      const time = document.createElement('span');
      time.className = 'msg-time';
      time.textContent = new Date(msg.timestamp).toLocaleTimeString('ar-EG',{hour:'2-digit',minute:'2-digit'});
      group.appendChild(msgDiv);
      group.appendChild(time);
      chatMessagesContainer.appendChild(group);
    }

    function buildPlayer(url, msgId) {
      const wrap = document.createElement('div');
      wrap.className = 'msg-voice-player';
      const playBtn = document.createElement('button');
      playBtn.className = 'voice-play-btn';
      playBtn.innerHTML = '<i class="fa-solid fa-play"></i>';
      const bar  = document.createElement('div'); bar.className  = 'voice-progress-bar';
      const fill = document.createElement('div'); fill.className = 'voice-progress-fill';
      bar.appendChild(fill);
      const timeEl = document.createElement('span'); timeEl.className = 'voice-time'; timeEl.textContent = '--:--';
      wrap.append(playBtn, bar, timeEl);

      const audio = new Audio(url);
      activeVoicePlayers[msgId] = audio;

      audio.addEventListener('loadedmetadata', () => { timeEl.textContent = fmt(audio.duration); });
      audio.addEventListener('error',          () => { timeEl.textContent = 'خطأ'; });
      playBtn.addEventListener('click', e => {
        e.stopPropagation();
        Object.values(activeVoicePlayers).forEach(a => { if (a !== audio) a.pause(); });
        audio.paused ? audio.play() : audio.pause();
      });
      audio.addEventListener('play',  () => { playBtn.innerHTML = '<i class="fa-solid fa-pause"></i>'; });
      audio.addEventListener('pause', () => { playBtn.innerHTML = '<i class="fa-solid fa-play"></i>'; });
      audio.addEventListener('ended', () => { playBtn.innerHTML = '<i class="fa-solid fa-play"></i>'; fill.style.width='0%'; timeEl.textContent=fmt(audio.duration); });
      audio.addEventListener('timeupdate', () => { fill.style.width=`${(audio.currentTime/audio.duration)*100}%`; timeEl.textContent=fmt(audio.currentTime); });
      bar.addEventListener('click', e => {
        const r = bar.getBoundingClientRect();
        audio.currentTime = (1-(e.clientX-r.left)/r.width)*audio.duration;
      });
      return wrap;
    }

    function fmt(s) {
      if (!s||isNaN(s)) return '00:00';
      return `${String(Math.floor(s/60)).padStart(2,'0')}:${String(Math.floor(s%60)).padStart(2,'0')}`;
    }

    // ============================================================
    // إرسال الرسائل
    // ============================================================
    async function sendMessage(type, text='', fileUrl='', fileName='') {
      if (!selectedUserId) return;
      if (!navigator.onLine) { showToast('لا يوجد اتصال بالإنترنت', 'error'); return; }
      const msgId = db.ref().push().key;
      await db.ref(`messages/${selectedUserId}/${msgId}`).set({
        id:msgId, sender:'admin', text, type, timestamp:Date.now(), fileUrl, fileName
      });
      const snippets = { text, image:'📷 صورة', voice:'🎤 رسالة صوتية', audio:'🎵 ملف صوتي', file:'📁 ملف مرفق' };
      const cr = db.ref(`conversations/${selectedUserId}`);
      const cs = await cr.once('value');
      const unread = ((cs.exists()?cs.val().unreadCountByUser:0)||0)+1;
      await cr.set({
        userId:selectedUserId,
        userName:selectedUserName,
        lastMessage:snippets[type]||text,
        lastMessageTimestamp:Date.now(),
        unreadCountByAdmin:0,
        unreadCountByUser:unread
      });
    }

    // ============================================================
    // Textarea & Send
    // ============================================================
    chatTextInput.addEventListener('input', function() {
      this.style.height = 'auto';
      this.style.height = (this.scrollHeight-10)+'px';
      micIcon.className = this.value.trim() ? 'fa-solid fa-paper-plane' : 'fa-solid fa-microphone';
    });

    $('voice-record-trigger').addEventListener('click', () => {
      const txt = chatTextInput.value.trim();
      if (txt) {
        sendMessage('text', txt);
        chatTextInput.value = ''; chatTextInput.style.height = 'auto';
        micIcon.className = 'fa-solid fa-microphone';
      } else {
        startRecording();
      }
    });

    // ============================================================
    // Voice Recording
    // ============================================================
    function stopTracks() { if (localStream) { localStream.getTracks().forEach(t=>t.stop()); localStream=null; } }

    async function startRecording() {
      if (!navigator.onLine) { showToast('لا يوجد اتصال', 'error'); return; }
      try {
        localStream = await navigator.mediaDevices.getUserMedia({ audio: true });
        const types = ['audio/webm;codecs=opus','audio/webm','audio/mp4','audio/ogg;codecs=opus','audio/ogg'];
        const mime  = types.find(t => MediaRecorder.isTypeSupported(t)) || '';
        mediaRecorder = new MediaRecorder(localStream, mime ? { mimeType: mime } : {});
        currentMimeType = mediaRecorder.mimeType;
        audioChunks = [];
        mediaRecorder.ondataavailable = e => { if (e.data.size > 0) audioChunks.push(e.data); };
        mediaRecorder.start(250);
        voiceRecOverlay.classList.add('active');
        recordStartTime = Date.now();
        recDuration.textContent = '00:00';
        recordTimer = setInterval(() => {
          const s = Math.floor((Date.now()-recordStartTime)/1000);
          recDuration.textContent = `${String(Math.floor(s/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`;
        }, 1000);
      } catch(err) {
        console.error(err);
        showToast('لا يمكن الوصول للميكروفون — تأكد من إعطاء الصلاحية', 'error');
      }
    }

    $('btn-cancel-recording').addEventListener('click', () => {
      clearInterval(recordTimer); voiceRecOverlay.classList.remove('active');
      if (mediaRecorder && mediaRecorder.state !== 'inactive') mediaRecorder.stop();
      stopTracks(); audioChunks = [];
    });

    $('btn-send-recording').addEventListener('click', () => {
      clearInterval(recordTimer); voiceRecOverlay.classList.remove('active');
      if (!mediaRecorder || mediaRecorder.state === 'inactive') return;
      mediaRecorder.onstop = async () => {
        stopTracks();
        if (!audioChunks.length) { showToast('لم يتم التقاط صوت', 'warning'); return; }
        let ext = 'webm';
        if (currentMimeType.includes('mp4')) ext = 'mp4';
        else if (currentMimeType.includes('ogg')) ext = 'ogg';
        const blob = new Blob(audioChunks, { type: currentMimeType || 'audio/webm' });
        const file = new File([blob], `admin_voice_${Date.now()}.${ext}`, { type: blob.type });
        const id   = 'tmp_v_'+Date.now();
        renderPlaceholder(id, 'جاري إرسال التسجيل...');
        try {
          const b64 = await toBase64(file, 'voice');
          $(id)?.remove();
          await sendMessage('voice', '', b64, file.name);
        } catch(err) {
          $(id)?.remove();
          showToast(err.message, 'warning');
        }
      };
      mediaRecorder.stop();
    });

    function renderPlaceholder(id, txt) {
      const d = document.createElement('div');
      d.id = id; d.className = 'msg-group admin';
      d.innerHTML = `<div class="message" style="opacity:0.7;font-style:italic"><span class="loading-spinner"></span> ${txt}</div>`;
      chatMessagesContainer.appendChild(d);
      chatMessagesContainer.scrollTop = chatMessagesContainer.scrollHeight;
    }

    // ============================================================
    // Attachments
    // ============================================================
    $('attach-trigger-btn').addEventListener('click', e => {
      e.stopPropagation();
      attachmentPopupMenu.classList.toggle('active');
    });
    document.addEventListener('click', () => attachmentPopupMenu.classList.remove('active'));

    $('attach-image-btn').addEventListener('click', () => {
      attachmentPopupMenu.classList.remove('active');
      $('file-image-input').click();
    });
    $('attach-audio-btn').addEventListener('click', () => {
      attachmentPopupMenu.classList.remove('active');
      $('file-audio-input').click();
    });
    $('attach-doc-btn').addEventListener('click', () => {
      attachmentPopupMenu.classList.remove('active');
      $('file-doc-input').click();
    });

    async function handleFile(inputId, type) {
      const file = $(inputId).files[0]; if (!file) return;
      const labels = { image:'الصورة', audio:'الملف الصوتي', file:'الملف' };
      const id = 'tmp_'+type+'_'+Date.now();
      renderPlaceholder(id, `جاري إرسال ${labels[type]}...`);
      try {
        const b64 = await toBase64(file, type);
        $(id)?.remove();
        await sendMessage(type === 'file' ? 'file' : type, '', b64, file.name);
      } catch(err) {
        $(id)?.remove();
        showToast(err.message, 'warning');
      }
      $(inputId).value = '';
    }

    $('file-image-input').addEventListener('change', () => handleFile('file-image-input','image'));
    $('file-audio-input').addEventListener('change', () => handleFile('file-audio-input','audio'));
    $('file-doc-input').addEventListener('change',   () => handleFile('file-doc-input','file'));

    // ============================================================
    // Back button (mobile)
    // ============================================================
    backToListBtn.addEventListener('click', () => {
      closeCurrentChat();
      if (window.innerWidth <= 860) {
        openSidebarMobile();
      }
    });

    // ============================================================
    // زر مسح المحادثة من الهيدر
    // ============================================================
    deleteChatBtn.addEventListener('click', () => {
      if (!selectedUserId) return;
      deleteConversation(selectedUserId);
    });

    // ============================================================
    // Lightbox
    // ============================================================
    $('close-lightbox').addEventListener('click', () => imageLightbox.classList.remove('active'));
    imageLightbox.addEventListener('click', (e) => {
      if (e.target === imageLightbox) imageLightbox.classList.remove('active');
    });

    // ============================================================
    // Keyboard shortcut: Escape
    // ============================================================
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        imageLightbox.classList.remove('active');
        if (window.innerWidth <= 860 && dashboardSidebar.classList.contains('open')) {
          closeSidebarMobile();
        }
      }
    });

    // ============================================================
    // إعادة فتح القائمة عند تغيير حجم الشاشة من كبير إلى صغير
    // ============================================================
    window.addEventListener('resize', () => {
      if (window.innerWidth <= 860 && !selectedUserId && !dashboardSidebar.classList.contains('open')) {
        openSidebarMobile();
      }
    });

  })();
</script>
</body>
</html>
