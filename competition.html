<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5">
<title>إدارة المحتوى — لوحة تحكم أواب</title>
<link rel="icon" href="logo.png">
<link rel="stylesheet" href="style.css">
<script>(function(){try{var t=localStorage.getItem('adminTheme');if(t==='dark'||(!t&&window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches)){document.documentElement.setAttribute('data-theme','dark');}}catch(e){}})();</script>
</head>
<body>

<nav class="admin-nav" id="adminNav"></nav>

<main class="admin-page">
  <a class="back-link" href="home.html" id="backLink">كل المحتوى</a>

  <div class="admin-page-head">
    <div>
      <h1 class="page-title" id="compTitle">جارٍ التحميل...</h1>
      <p class="page-sub" id="compDesc"></p>
    </div>
    <div style="display:flex; gap:8px; flex-wrap:wrap;">
      <button type="button" class="btn btn-outline" id="settingsToggleBtn" style="width:auto;">إعدادات المحتوى</button>
      <a class="btn btn-outline" id="participantsLink" href="#" style="width:auto;">المشتركون والنقاط</a>
      <a class="btn btn-gold" id="addLessonLink" href="#" style="width:auto;">إضافة محاضرة جديدة</a>
    </div>
  </div>

  <div class="info-card" id="settingsPanel" style="display:none; margin-bottom:22px;">
    <div class="form-msg" id="settingsMsg"></div>
    <div class="field">
      <label>نوع المحتوى</label>
      <div style="display:flex; gap:10px;">
        <label style="flex:1; display:flex; align-items:center; gap:8px; padding:12px 14px; border:1.5px solid var(--border); border-radius:var(--radius-sm); cursor:pointer;">
          <input type="radio" name="editContentType" value="course" style="accent-color:var(--primary);">
          <span id="editCourseTypeIcon"></span> كورس
        </label>
        <label style="flex:1; display:flex; align-items:center; gap:8px; padding:12px 14px; border:1.5px solid var(--border); border-radius:var(--radius-sm); cursor:pointer;">
          <input type="radio" name="editContentType" value="competition" style="accent-color:var(--gold);">
          <span id="editCompTypeIcon"></span> مسابقة
        </label>
      </div>
    </div>
    <div class="field">
      <label for="editTitle">الاسم</label>
      <input type="text" id="editTitle" required>
    </div>
    <div class="field">
      <label for="editDesc">الوصف (اختياري)</label>
      <textarea id="editDesc" rows="4" style="width:100%; padding:13px 15px; border:1.5px solid var(--border); border-radius:var(--radius-sm); font-family:inherit; font-size:0.9375rem; resize:vertical;"></textarea>
    </div>
    <div class="field">
      <label for="editCover">رابط صورة الغلاف (اختياري)</label>
      <input type="url" id="editCover" placeholder="https://...">
      <div class="field-hint">اتركه فارغًا لإزالة صورة الغلاف الحالية.</div>
    </div>
    <div id="editCoverPreviewWrap" style="display:none; margin-bottom:14px;">
      <img id="editCoverPreview" alt="" style="max-height:140px; border-radius:var(--radius-sm); border:1px solid var(--border);">
    </div>
    <div style="display:flex; gap:8px;">
      <button type="button" class="btn btn-gold" id="saveSettingsBtn" style="width:auto;">حفظ التعديلات</button>
      <button type="button" class="btn btn-ghost" id="cancelSettingsBtn" style="width:auto;">إلغاء</button>
    </div>
  </div>

  <div id="lessonsWrap">
    <div class="center-loading"><div class="loader"></div></div>
  </div>
</main>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="icons.js"></script>
<script src="admin-shell.js"></script>
<script>
  document.getElementById('backLink').innerHTML = icon('arrowRight', 'icon-sm') + ' كل المحتوى';
  document.getElementById('settingsToggleBtn').innerHTML = icon('gear', 'icon-sm') + ' إعدادات المحتوى';
  document.getElementById('editCourseTypeIcon').innerHTML = icon('bookOpen', 'icon-sm');
  document.getElementById('editCompTypeIcon').innerHTML = icon('trophy', 'icon-sm');
  document.getElementById('participantsLink').innerHTML = icon('medal', 'icon-sm') + ' المشتركون والنقاط';
  document.getElementById('addLessonLink').innerHTML = icon('plus') + ' إضافة محاضرة جديدة';

  const params = new URLSearchParams(window.location.search);
  const compId = params.get('id');
  if (!compId) window.location.href = 'home.html';

  requireAdminAuth(function () {
    renderAdminNav('home');
    document.getElementById('addLessonLink').href = 'lesson.html?comp=' + encodeURIComponent(compId);
    document.getElementById('participantsLink').href = 'participants.html?id=' + encodeURIComponent(compId);
    loadCompetition();
  });

  let currentComp = null;

  function loadCompetition() {
    db.ref('competitions/' + compId).on('value', function (snap) {
      if (!snap.exists()) { window.location.href = 'home.html'; return; }
      const comp = snap.val();
      currentComp = comp;
      document.getElementById('compTitle').textContent = comp.title || 'بدون عنوان';
      document.getElementById('compDesc').textContent = comp.description || '';
      if (!settingsPanel.dataset.editing) populateSettingsForm(comp);
      renderLessons(comp.lessons || {});
    });
  }

  const settingsPanel = document.getElementById('settingsPanel');
  const editTitleInput = document.getElementById('editTitle');
  const editDescInput = document.getElementById('editDesc');
  const editCoverInput = document.getElementById('editCover');
  const coverPreviewWrap = document.getElementById('editCoverPreviewWrap');
  const coverPreviewImg = document.getElementById('editCoverPreview');

  function populateSettingsForm(comp) {
    editTitleInput.value = comp.title || '';
    editDescInput.value = comp.description || '';
    editCoverInput.value = comp.coverUrl || '';
    const type = comp.type === 'competition' ? 'competition' : 'course';
    const radio = document.querySelector('input[name="editContentType"][value="' + type + '"]');
    if (radio) radio.checked = true;
    updateCoverPreview();
  }

  function updateCoverPreview() {
    const url = editCoverInput.value.trim();
    if (url) {
      coverPreviewImg.src = url;
      coverPreviewWrap.style.display = 'block';
    } else {
      coverPreviewWrap.style.display = 'none';
    }
  }
  editCoverInput.addEventListener('input', updateCoverPreview);

  document.getElementById('settingsToggleBtn').addEventListener('click', function () {
    const opening = settingsPanel.style.display === 'none';
    if (opening && currentComp) populateSettingsForm(currentComp);
    settingsPanel.style.display = opening ? 'block' : 'none';
    settingsPanel.dataset.editing = opening ? '1' : '';
  });

  document.getElementById('cancelSettingsBtn').addEventListener('click', function () {
    settingsPanel.style.display = 'none';
    settingsPanel.dataset.editing = '';
  });

  document.getElementById('saveSettingsBtn').addEventListener('click', function () {
    const msg = document.getElementById('settingsMsg');
    const title = editTitleInput.value.trim();
    if (!title) { msg.textContent = 'من فضلك اكتب الاسم'; msg.className = 'form-msg show error'; return; }
    const description = editDescInput.value.trim();
    const coverUrl = editCoverInput.value.trim();
    const typeEl = document.querySelector('input[name="editContentType"]:checked');
    const type = typeEl ? typeEl.value : 'course';
    const btn = document.getElementById('saveSettingsBtn');
    btn.disabled = true;
    btn.textContent = 'جارٍ الحفظ...';
    db.ref('competitions/' + compId).update({
      title: title, description: description || '', coverUrl: coverUrl || null, type: type
    }).then(function () {
      msg.textContent = 'تم حفظ التعديلات بنجاح';
      msg.className = 'form-msg show success';
      settingsPanel.dataset.editing = '';
      btn.disabled = false;
      btn.textContent = 'حفظ التعديلات';
      setTimeout(function () { settingsPanel.style.display = 'none'; msg.classList.remove('show'); }, 1200);
    }).catch(function (err) {
      msg.textContent = 'تعذر الحفظ: ' + err.message;
      msg.className = 'form-msg show error';
      btn.disabled = false;
      btn.textContent = 'حفظ التعديلات';
    });
  });

  function renderLessons(lessons) {
    const wrap = document.getElementById('lessonsWrap');

    // نرتب حسب حقل order المخزن؛ ولو محاضرة قديمة من غير order، بنحافظ على ترتيب الإنشاء كافتراضي
    let ids = Object.keys(lessons);
    if (ids.length === 0) {
      wrap.innerHTML = '<div class="empty-state"><div class="empty-state-icon">' + icon('video', 'icon-xl') + '</div><p>لا توجد محاضرات بعد. أضِف المحاضرة الأولى.</p></div>';
      return;
    }
    ids = ids.map(function (id, i) { return { id: id, orderKey: (lessons[id].order !== undefined ? lessons[id].order : i) }; })
             .sort(function (a, b) { return a.orderKey - b.orderKey; })
             .map(function (x) { return x.id; });

    const now = Date.now();
    let html = '';
    ids.forEach(function (lessonId, index) {
      const lesson = lessons[lessonId];
      const videoCount = lesson.videos ? Object.keys(lesson.videos).length : 0;
      const examCount = lesson.exams ? Object.keys(lesson.exams).length : 0;
      const materialCount = lesson.materials ? Object.keys(lesson.materials).length : 0;
      const isLive = !lesson.releaseAt || lesson.releaseAt <= now;

      html +=
        '<div class="admin-lesson-row">' +
          '<div class="info">' +
            '<div class="lesson-num">' + (index + 1) + '</div>' +
            '<div>' +
              '<h4>' + escapeHtml(lesson.title || 'محاضرة') + '</h4>' +
              '<div class="meta-row">' +
                '<span>' + icon('video', 'icon-sm') + ' ' + videoCount + ' فيديو</span>' +
                '<span>' + icon('listCheck', 'icon-sm') + ' ' + examCount + ' اختبار</span>' +
                (materialCount > 0 ? '<span>' + icon('filePdf', 'icon-sm') + ' ' + materialCount + ' مرفق</span>' : '') +
                '<span class="status-pill ' + (isLive ? 'live' : 'scheduled') + '">' +
                  icon(isLive ? 'check' : 'clock', 'icon-sm') + ' ' + (isLive ? 'منشورة الآن' : 'تُنشر في ' + formatArabicDate(lesson.releaseAt)) +
                '</span>' +
              '</div>' +
            '</div>' +
          '</div>' +
          '<div class="actions" style="display:flex; align-items:center; gap:6px; flex-wrap:wrap;">' +
            '<div style="display:flex; flex-direction:column; gap:2px;">' +
              '<button type="button" class="btn btn-ghost btn-sm move-up-btn" data-index="' + index + '" ' + (index === 0 ? 'disabled style="opacity:.35; width:auto; padding:4px 8px;"' : 'style="width:auto; padding:4px 8px;"') + '>' + icon('chevronUp', 'icon-sm') + '</button>' +
              '<button type="button" class="btn btn-ghost btn-sm move-down-btn" data-index="' + index + '" ' + (index === ids.length - 1 ? 'disabled style="opacity:.35; width:auto; padding:4px 8px;"' : 'style="width:auto; padding:4px 8px;"') + '>' + icon('chevronDown', 'icon-sm') + '</button>' +
            '</div>' +
            '<a class="btn btn-outline btn-sm" href="lesson.html?comp=' + encodeURIComponent(compId) + '&lesson=' + encodeURIComponent(lessonId) + '">' + icon('pen', 'icon-sm') + ' تعديل</a>' +
            '<button class="btn btn-ghost btn-sm delete-lesson-btn" data-id="' + lessonId + '">' + icon('trash', 'icon-sm') + ' حذف</button>' +
          '</div>' +
        '</div>';
    });
    wrap.innerHTML = html;

    wrap.querySelectorAll('.delete-lesson-btn').forEach(function (btn) {
      btn.addEventListener('click', function () {
        if (!confirm('حذف هذه المحاضرة بكل فيديوهاتها واختباراتها؟ لن يؤثر هذا على النقاط التي جمعها المستخدمون بالفعل.')) return;
        db.ref('competitions/' + compId + '/lessons/' + btn.dataset.id).remove();
      });
    });

    // إعادة الترتيب: بنبدّل المحاضرة مع اللي جنبها، ثم نكتب order = 0..n-1 لكل المحاضرات دفعة واحدة
    function moveLesson(index, dir) {
      const newIndex = index + dir;
      if (newIndex < 0 || newIndex >= ids.length) return;
      const reordered = ids.slice();
      const tmp = reordered[index];
      reordered[index] = reordered[newIndex];
      reordered[newIndex] = tmp;

      const updateObj = {};
      reordered.forEach(function (id, i) { updateObj['competitions/' + compId + '/lessons/' + id + '/order'] = i; });
      db.ref().update(updateObj);
    }

    wrap.querySelectorAll('.move-up-btn').forEach(function (btn) {
      btn.addEventListener('click', function () { moveLesson(parseInt(btn.dataset.index, 10), -1); });
    });
    wrap.querySelectorAll('.move-down-btn').forEach(function (btn) {
      btn.addEventListener('click', function () { moveLesson(parseInt(btn.dataset.index, 10), 1); });
    });
  }
</script>
</body>
</html>
