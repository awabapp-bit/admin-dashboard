<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5">
<title>تفاصيل الحساب — لوحة تحكم أواب</title>
<link rel="icon" href="logo.png">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="sidebar.css">
<script>(function(){try{var t=localStorage.getItem('adminTheme');if(t==='dark'||(!t&&window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches)){document.documentElement.setAttribute('data-theme','dark');}}catch(e){}})();</script>
</head>
<body>

<nav class="sb" id="adminNav"></nav>

<main class="admin-page" style="max-width:880px;">
  <a class="back-link" href="users.html" id="backLink">كل الحسابات</a>

  <div id="content">
    <div class="center-loading"><div class="loader"></div></div>
  </div>
</main>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="icons.js"></script>
<script src="admin-shell.js"></script>
<script>
  document.getElementById('backLink').innerHTML = icon('arrowRight', 'icon-sm') + ' كل الحسابات';

  const params = new URLSearchParams(window.location.search);
  const targetUid = params.get('uid');
  if (!targetUid) window.location.href = 'users.html';

  let myUid = null;

  requireAdminAuth(function (user) {
    myUid = user.uid;
    renderAdminNav('users');
    load();
  });

  function load() {
    Promise.all([
      db.ref('users/' + targetUid).once('value'),
      safeRead('userProgress/' + targetUid)
    ]).then(function (res) {
      const snap = res[0];
      if (!snap.exists()) { window.location.href = 'users.html'; return; }
      const u = snap.val();
      u.points = getUserPoints(u, res[1]);
      render(u);
    }).catch(function (err) {
      document.getElementById('content').innerHTML = '<p style="color:var(--danger); padding:20px;">تعذر تحميل بيانات الحساب: ' + escapeHtml(explainDbError(err)) + '</p>';
    });
  }

  function render(u) {
    const blocked = u.blocked === true;
    const admin = u.isAdmin === true;
    const isSelf = targetUid === myUid;
    const initial = (u.name || '؟').trim().charAt(0);
    document.title = (u.name || 'حساب') + ' — لوحة تحكم أواب';

    const content = document.getElementById('content');
    content.innerHTML =
      '<section class="ad-hero ' + (blocked ? 'is-blocked' : '') + '">' +
        '<div class="acct-av ad-av" aria-hidden="true">' + escapeHtml(initial) + '</div>' +
        '<div class="ad-id">' +
          '<h1>' + escapeHtml(u.name || '—') + (admin ? '<span class="admin-badge-pill">' + icon('shield', 'icon-sm') + ' مسؤول</span>' : '') + '</h1>' +
          '<div class="acct-email">' + escapeHtml(u.email || '—') + '</div>' +
        '</div>' +
        '<span class="acct-status ' + (blocked ? 'is-blocked' : '') + '">' + (blocked ? 'محظور' : 'نشط') + '</span>' +
      '</section>' +

      '<dl class="ad-facts">' +
        fact('star', 'النقاط', '<span class="ad-pts">' + (u.points || 0) + '</span>') +
        fact('calendar', 'تاريخ التسجيل', formatArabicDate(u.createdAt)) +
        fact('phone', 'رقم الهاتف', u.phone ? '<span class="acct-phone">' + escapeHtml(u.phone) + '</span>' : '<span class="muted">غير مسجّل</span>') +
        fact('user', 'النوع', u.gender === 'male' ? 'ذكر' : u.gender === 'female' ? 'أنثى' : '<span class="muted">غير مسجّل</span>') +
      '</dl>' +

      '<div class="stat-grid" id="userStatGrid" style="margin:0 0 20px;">' +
        '<div class="center-loading" style="grid-column:1/-1; min-height:70px;"><div class="loader"></div></div>' +
      '</div>' +

      '<h3 class="section-title">' + icon('trophy', 'icon-sm') + ' التقدّم الدراسي</h3>' +
      '<div id="userProgressWrap" style="margin-bottom:20px;">' +
        '<div class="center-loading" style="min-height:80px;"><div class="loader"></div></div>' +
      '</div>' +

      '<h3 class="section-title">' + icon('clock', 'icon-sm') + ' آخر نشاط</h3>' +
      '<div class="ad-activity" id="userActivityWrap"></div>' +

      '<section class="ad-actions">' +
        '<div class="ad-actions-row">' +
          '<button class="btn btn-gold" id="resetLinkBtn" style="width:auto;">' + icon('envelope') + ' إرسال رابط إعادة تعيين كلمة المرور</button>' +
          (admin ? '' :
            '<button class="btn btn-outline" id="resetPointsBtn" style="width:auto;">' + icon('hourglass') + ' إعادة تعيين النقاط</button>' +
            '<button class="btn ' + (blocked ? 'btn-primary' : 'btn-ghost') + '" id="blockBtn" style="width:auto;">' + icon('lock') + ' ' + (blocked ? 'إلغاء الحظر' : 'حظر الحساب') + '</button>'
          ) +
        '</div>' +
        '<p class="ad-note">Firebase لا يخزّن كلمة المرور الحقيقية في أي مكان (حتى المطوّر مش بيقدر يوصلها)، فمفيش طريقة لعرضها. البديل: ابعت للمستخدم رابط إعادة تعيين آمن على بريده.</p>' +
        '<div class="ad-danger">' +
          (isSelf
            ? '<p class="ad-note">ده حسابك الحالي، فمينفعش يتحذف من هنا (عشان ما تفقدش صلاحية الدخول للوحة). لحذفه ادخل بحساب مسؤول تاني.</p>'
            : '<p class="ad-note">' + (admin ? 'ده حساب مسؤول — حذفه هيشيل صلاحياته من اللوحة نهائيًا. ' : '') + 'حذف الحساب بيمسح كل بياناته من الموقع نهائيًا (نقاطه، اشتراكاته، إشعاراته، محادثاته). سجل الدخول (Firebase Authentication) بيفضل موجود تقنيًا لحد ما تحذفه يدويًا من Firebase Console لو عايز تمنعه من عمل حساب جديد بنفس البريد.</p>' +
              '<button class="btn btn-danger" id="deleteBtn" style="width:auto;">' + icon('trash') + ' حذف الحساب نهائيًا</button>') +
        '</div>' +
        '<div class="form-msg" id="actionMsg"></div>' +
      '</section>';

    loadUserSummary(u);
    mountActivityFeed(document.getElementById('userActivityWrap'), { uid: targetUid, pageSize: 8 });

    document.getElementById('resetLinkBtn').addEventListener('click', function () {
      const msg = document.getElementById('actionMsg');
      auth.sendPasswordResetEmail(u.email, { url: RESET_SITE_URL })
        .then(function () {
          msg.textContent = 'تم إرسال رابط إعادة تعيين كلمة المرور إلى ' + u.email;
          msg.className = 'form-msg show success';
        })
        .catch(function (err) {
          msg.textContent = 'تعذر إرسال الرابط: ' + (err.message || err.code);
          msg.className = 'form-msg show error';
        });
    });

    const resetBtn = document.getElementById('resetPointsBtn');
    if (resetBtn) {
      resetBtn.addEventListener('click', function () {
        if (!confirm('هل تريد إعادة تعيين كل نقاط هذا المستخدم إلى صفر؟ سيتم مسح كل تقدّمه في كل الكورسات والمسابقات.')) return;
        Promise.all([db.ref('users/' + targetUid + '/points').set(0), db.ref('userProgress/' + targetUid).remove()])
          .then(function () { load(); })
          .catch(function (err) { showToast('تعذر إعادة التعيين: ' + err.message, 'error'); });
      });
    }

    const blockBtn = document.getElementById('blockBtn');
    if (blockBtn) {
      blockBtn.addEventListener('click', function () {
        const msgText = blocked ? 'إلغاء حظر هذا الحساب؟' : 'حظر هذا الحساب؟ لن يتمكن من الدخول للمنصة.';
        if (!confirm(msgText)) return;
        db.ref('users/' + targetUid + '/blocked').set(!blocked)
          .then(function () { load(); })
          .catch(function (err) { showToast('تعذر تنفيذ الإجراء: ' + err.message, 'error'); });
      });
    }

    const deleteBtn = document.getElementById('deleteBtn');
    if (deleteBtn) {
      deleteBtn.addEventListener('click', function () {
        const name = u.name || u.email || 'هذا المستخدم';
        if (!confirm(admin
          ? 'حذف حساب المسؤول "' + name + '"؟ ده حساب له صلاحيات كاملة على اللوحة، وهيتحذف نهائيًا بكل بياناته. لا يمكن التراجع عن هذا الإجراء.'
          : 'هل أنت متأكد من حذف حساب "' + name + '" نهائيًا؟ سيُحذف نهائيًا كل شيء: نقاطه، تقدّمه، اشتراكاته في كل المسابقات، إشعاراته، ومحادثات الدعم الفني معه. لا يمكن التراجع عن هذا الإجراء.')) return;
        if (prompt('للتأكيد، اكتب "حذف" في المربع التالي:') !== 'حذف') { showToast('تم إلغاء الحذف.', 'warning'); return; }
        deleteBtn.disabled = true;
        deleteBtn.textContent = 'جارٍ الحذف...';
        deleteUserAccountData(targetUid)
          .then(function () { window.location.href = 'users.html'; })
          .catch(function (err) {
            showToast('تعذر حذف الحساب: ' + err.message, 'error');
            deleteBtn.disabled = false;
            deleteBtn.innerHTML = icon('trash') + ' حذف الحساب نهائيًا';
          });
      });
    }
  }

  /**
   * يجمع ملخّص الحساب: المخالفات، الاختبارات المُسلَّمة، التقدّم الدراسي، ومحادثة الدعم الفني،
   * ويعرضها كإحصائيات سريعة + قائمة التقدّم الدراسي. (سجل النشاط الزمني اتشال.)
   */
  function loadUserSummary(u) {
    Promise.all([
      safeRead('violations/' + targetUid),
      safeRead('userProgress/' + targetUid),
      safeRead('examAttempts'),
      safeRead('competitions'),
      db.ref('conversations/' + targetUid).once('value').then(function (s) { return s.val() || null; }).catch(function () { return null; })
    ]).then(function (results) {
      const violations = results[0] || {};
      const progress = results[1] || {};
      const allAttempts = results[2] || {};
      const comps = results[3] || {};
      const conversation = results[4] || null;

      let examsSubmitted = 0;
      Object.keys(allAttempts).forEach(function (cid) {
        const lessons = allAttempts[cid] || {};
        Object.keys(lessons).forEach(function (lid) {
          const exams = lessons[lid] || {};
          Object.keys(exams).forEach(function (eid) {
            const a = (exams[eid] || {})[targetUid];
            if (a && (a.submitted || a.submittedAt)) examsSubmitted++;
          });
        });
      });

      // -------- التقدّم الدراسي --------
      const compIds = Object.keys(progress);
      const progressWrap = document.getElementById('userProgressWrap');
      if (compIds.length === 0) {
        progressWrap.innerHTML = '<p style="color:var(--text-muted); font-size:0.8125rem; text-align:center; padding:16px 0; margin:0;">لسه ما بدأش أي محتوى تعليمي.</p>';
      } else {
        progressWrap.innerHTML = compIds.map(function (cid) {
          const comp = comps[cid] || {};
          const lessonsProgress = progress[cid] || {};
          const lessonIds = Object.keys(lessonsProgress);
          const totalPoints = lessonIds.reduce(function (sum, lid) { return sum + (Number(lessonsProgress[lid] && lessonsProgress[lid].earnedPoints) || 0); }, 0);
          return '<div class="admin-lesson-row" style="margin-bottom:10px;">' +
            '<div class="info">' +
              '<h4>' + escapeHtml(comp.title || 'محتوى محذوف') + '</h4>' +
              '<div class="meta-row">' +
                '<span>' + icon('book', 'icon-sm') + ' ' + lessonIds.length + ' محاضرة تم التفاعل معها</span>' +
                '<span>' + icon('star', 'icon-sm') + ' ' + totalPoints + ' نقطة مكتسبة من هذا المحتوى</span>' +
              '</div>' +
            '</div>' +
          '</div>';
        }).join('');
      }

      // -------- إحصائيات سريعة --------
      document.getElementById('userStatGrid').innerHTML =
        '<div class="stat-card"><div class="stat-icon">' + icon('bell', 'icon-md') + '</div><div><div class="stat-value">' + Object.keys(violations).length + '</div><div class="stat-label">مخالفة مسجّلة</div></div></div>' +
        '<div class="stat-card"><div class="stat-icon">' + icon('trophy', 'icon-md') + '</div><div><div class="stat-value">' + examsSubmitted + '</div><div class="stat-label">اختبار تم تسليمه</div></div></div>' +
        '<div class="stat-card"><div class="stat-icon">' + icon('book', 'icon-md') + '</div><div><div class="stat-value">' + compIds.length + '</div><div class="stat-label">محتوى تعليمي شارك فيه</div></div></div>' +
        '<div class="stat-card"><div class="stat-icon">' + icon('headset', 'icon-md') + '</div><div><div class="stat-value">' + (conversation ? (conversation.unreadCountByAdmin || 0) : '—') + '</div><div class="stat-label">رسالة دعم غير مقروءة</div></div></div>';
    }).catch(function (err) {
      const msg = '<p style="color:var(--danger); font-size:0.8125rem; text-align:center; padding:16px 0; margin:0;">تعذر تحميل ملخّص الحساب: ' + escapeHtml(err.message || '') + '</p>';
      document.getElementById('userProgressWrap').innerHTML = msg;
      document.getElementById('userStatGrid').innerHTML = '';
    });
  }

  function fact(iconName, label, value) {
    return '<div class="ad-fact"><dt>' + icon(iconName, 'icon-sm') + ' ' + label + '</dt><dd>' + value + '</dd></div>';
  }
</script>
</body>
</html>
