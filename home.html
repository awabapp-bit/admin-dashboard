<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5">
<title>لوحة تحكم أواب — المحتوى التعليمي</title>
<link rel="icon" href="logo.png">
<link rel="stylesheet" href="style.css">
<script>(function(){try{var t=localStorage.getItem('adminTheme');if(t==='dark'||(!t&&window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches)){document.documentElement.setAttribute('data-theme','dark');}}catch(e){}})();</script>
</head>
<body>

<nav class="admin-nav" id="adminNav"></nav>

<main class="admin-page">
  <div class="admin-page-head">
    <div>
      <h1 class="page-title">المحتوى التعليمي</h1>
      <p class="page-sub">إدارة الكورسات والمسابقات ومحاضراتها (فيديوهات و/أو اختبارات و/أو مرفقات)</p>
    </div>
    <a href="add-competition.html" class="btn btn-gold" style="width:auto;" id="addBtn">إضافة محتوى جديد</a>
  </div>

  <div class="stat-grid" id="statGrid">
    <div class="skel-stat-grid">
      <div class="skel skel-stat-card"></div><div class="skel skel-stat-card"></div>
      <div class="skel skel-stat-card"></div><div class="skel skel-stat-card"></div>
    </div>
  </div>

  <div class="dash-grid" id="dashGrid" style="display:none;">
    <div class="dash-card">
      <h3 id="newUsersChartTitle">المستخدمون الجدد — آخر 30 يوم</h3>
      <p class="dash-sub">عدد الحسابات الجديدة يوميًا</p>
      <div class="bar-chart" id="newUsersChart"></div>
      <div class="bar-chart-labels"><span>قبل 30 يوم</span><span>اليوم</span></div>
    </div>
    <div class="dash-card">
      <h3>أكثر المحاضرات تفاعلاً</h3>
      <p class="dash-sub">حسب عدد المستخدمين الذين بدأوها</p>
      <div class="rank-list" id="topLessonsList"></div>
    </div>
  </div>

  <div class="admin-page-head" style="border-bottom:none; margin-bottom:14px; padding-bottom:0;">
    <h2 class="page-title" style="font-size:1.125rem;">كل الكورسات والمسابقات</h2>
  </div>

  <div id="compsList">
    <div class="skel skel-row"></div>
    <div class="skel skel-row"></div>
    <div class="skel skel-row"></div>
  </div>
</main>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="icons.js"></script>
<script src="admin-shell.js"></script>
<script>
  document.getElementById('addBtn').innerHTML = icon('plus') + ' إضافة محتوى جديد';

  requireAdminAuth(function () {
    renderAdminNav('home');
    // تحميل الإحصائيات والمحتوى بعد إنشاء القائمة الجانبية
    loadStats();
    loadCompetitions();
  });

  function loadStats() {
    Promise.all([
      db.ref('competitions').once('value'),
      db.ref('users').once('value'),
      db.ref('violations').once('value'),
      db.ref('examAttempts').once('value'),
      db.ref('userProgress').once('value')
    ]).then(function (results) {
      const comps = results[0].val() || {};
      const usersObj = results[1].val() || {};
      const violations = results[2].val() || {};
      const examAttempts = results[3].val() || {};
      const userProgress = results[4].val() || {};

      const users = Object.keys(usersObj).map(function (uid) { return Object.assign({ uid: uid }, usersObj[uid]); });
      const realUsers = users.filter(function (u) { return u.isAdmin !== true; });

      let lessonCount = 0, examCount = 0, competitionOnlyCount = 0;
      const compIds = Object.keys(comps);
      compIds.forEach(function (cid) {
        const lessons = comps[cid].lessons || {};
        const lessonIds = Object.keys(lessons);
        lessonCount += lessonIds.length;
        lessonIds.forEach(function (lid) {
          examCount += lessons[lid].exams ? Object.keys(lessons[lid].exams).length : 0;
        });
        if (comps[cid].type === 'competition') competitionOnlyCount++;
      });

      const activeUsers = realUsers.filter(function (u) { return u.blocked !== true; }).length;

      let violationsTotal = 0;
      Object.keys(violations).forEach(function (uid) { violationsTotal += Object.keys(violations[uid] || {}).length; });

      const now = Date.now();
      let submissionsToday = 0;
      Object.keys(examAttempts).forEach(function (cid) {
        Object.keys(examAttempts[cid]).forEach(function (lid) {
          Object.keys(examAttempts[cid][lid]).forEach(function (eid) {
            Object.keys(examAttempts[cid][lid][eid]).forEach(function (uid) {
              const a = examAttempts[cid][lid][eid][uid];
              if (a && a.submittedAt && (now - a.submittedAt) < 86400000) submissionsToday++;
            });
          });
        });
      });

      let lastReg = 0;
      realUsers.forEach(function (u) { if ((u.createdAt || 0) > lastReg) lastReg = u.createdAt || 0; });

      document.getElementById('statGrid').innerHTML =
        statCard('users', realUsers.length, 'إجمالي المستخدمين') +
        statCard('circleCheck', activeUsers, 'مستخدم نشط') +
        statCard('listCheck', lessonCount, 'محاضرة') +
        statCard('trophy', competitionOnlyCount, 'مسابقة') +
        statCard('pen', examCount, 'اختبار') +
        statCard('fire', submissionsToday, 'مشاركة اليوم') +
        statCard('bell', violationsTotal, 'مخالفة مسجّلة') +
        statCard('clock', lastReg ? formatArabicDate(lastReg) : '—', 'آخر تسجيل', true);

      renderNewUsersChart(realUsers);
      renderTopLessons(comps, userProgress);

      document.getElementById('dashGrid').style.display = '';
    });
  }

  function statCard(iconName, value, label, small) {
    return '<div class="stat-card"><div class="stat-icon">' + icon(iconName, 'icon-md') + '</div>' +
      '<div><div class="stat-value"' + (small ? ' style="font-size:0.9375rem;"' : '') + '>' + value + '</div><div class="stat-label">' + label + '</div></div></div>';
  }

  function renderNewUsersChart(realUsers) {
    const days = 30;
    const counts = new Array(days).fill(0);
    const today = new Date(); today.setHours(0, 0, 0, 0);
    realUsers.forEach(function (u) {
      if (!u.createdAt) return;
      const d = new Date(u.createdAt); d.setHours(0, 0, 0, 0);
      const diffDays = Math.round((today - d) / 86400000);
      if (diffDays >= 0 && diffDays < days) counts[days - 1 - diffDays]++;
    });
    const max = Math.max.apply(null, counts.concat([1]));
    document.getElementById('newUsersChart').innerHTML = counts.map(function (c) {
      const h = Math.max(Math.round((c / max) * 100), c > 0 ? 6 : 2);
      return '<div class="bar-col" title="' + c + ' حساب جديد"><span class="bar-tip">' + (c > 0 ? c : '') + '</span><div class="bar" style="height:' + h + '%;"></div></div>';
    }).join('');
  }

  function renderTopLessons(comps, userProgress) {
    const counts = {};
    const titles = {};
    Object.keys(comps).forEach(function (cid) {
      const lessons = comps[cid].lessons || {};
      Object.keys(lessons).forEach(function (lid) {
        titles[cid + '_' + lid] = (lessons[lid].title || 'محاضرة') + ' — ' + (comps[cid].title || '');
        counts[cid + '_' + lid] = 0;
      });
    });
    Object.keys(userProgress).forEach(function (uid) {
      const compsProg = userProgress[uid] || {};
      Object.keys(compsProg).forEach(function (cid) {
        const lessonsProg = compsProg[cid] || {};
        Object.keys(lessonsProg).forEach(function (lid) {
          const key = cid + '_' + lid;
          if (key in counts) counts[key]++;
        });
      });
    });

    const top = Object.keys(counts)
      .map(function (k) { return { key: k, title: titles[k], count: counts[k] }; })
      .sort(function (a, b) { return b.count - a.count; })
      .filter(function (r) { return r.count > 0; })
      .slice(0, 6);

    const list = document.getElementById('topLessonsList');
    if (top.length === 0) {
      list.innerHTML = '<p style="color:var(--text-muted); font-size:0.7812rem;">لا يوجد تفاعل مسجّل بعد.</p>';
      return;
    }
    const max = top[0].count || 1;
    list.innerHTML = top.map(function (r, i) {
      return '<div class="rank-item">' +
        '<div class="rank-no">' + (i + 1) + '</div>' +
        '<div class="rank-body"><div class="rank-name">' + escapeHtml(r.title) + '</div>' +
        '<div class="rank-track"><div class="rank-fill" style="width:' + Math.round((r.count / max) * 100) + '%;"></div></div></div>' +
        '<div class="rank-count">' + r.count + ' مستخدم</div>' +
      '</div>';
    }).join('');
  }

  function loadCompetitions() {
    const wrap = document.getElementById('compsList');
    db.ref('competitions').on('value', function (snap) {
      const data = snap.val() || {};
      const ids = Object.keys(data);

      if (ids.length === 0) {
        wrap.innerHTML = '<div class="empty-state"><div class="empty-state-icon">' + icon('trophy', 'icon-xl') + '</div><p>لا يوجد محتوى بعد. ابدأ بإضافة أول كورس أو مسابقة.</p></div>';
        return;
      }

      let html = '';
      ids.forEach(function (id) {
        const c = data[id];
        const lessons = c.lessons || {};
        const lessonIds = Object.keys(lessons);
        let videoCount = 0, examCount = 0;
        lessonIds.forEach(function (lid) {
          videoCount += lessons[lid].videos ? Object.keys(lessons[lid].videos).length : 0;
          examCount += lessons[lid].exams ? Object.keys(lessons[lid].exams).length : 0;
        });

        const isCourse = c.type !== 'competition';
        html +=
          '<div class="admin-comp-card">' +
            (c.coverUrl ? '<img src="' + escapeHtml(c.coverUrl) + '" alt="" class="comp-card-thumb" onerror="this.style.display=\'none\'">' : '') +
            '<div class="info">' +
              '<h3>' + escapeHtml(c.title || 'بدون عنوان') + '</h3>' +
              (c.description ? '<p>' + escapeHtml(c.description) + '</p>' : '') +
              '<div class="tags">' +
                '<span class="tag ' + (isCourse ? '' : 'mix-tag') + '">' + icon(isCourse ? 'bookOpen' : 'trophy', 'icon-sm') + ' ' + (isCourse ? 'كورس' : 'مسابقة') + '</span>' +
                '<span class="tag">' + icon('listCheck', 'icon-sm') + ' ' + lessonIds.length + ' محاضرة</span>' +
                '<span class="tag mix-tag video-tag">' + icon('video', 'icon-sm') + ' ' + videoCount + ' فيديو</span>' +
                '<span class="tag mix-tag">' + icon('pen', 'icon-sm') + ' ' + examCount + ' اختبار</span>' +
              '</div>' +
            '</div>' +
            '<div class="actions">' +
              '<a class="btn btn-outline btn-sm" href="competition.html?id=' + encodeURIComponent(id) + '">' + icon('pen', 'icon-sm') + ' إدارة المحاضرات</a>' +
              '<a class="btn btn-outline btn-sm" href="participants.html?id=' + encodeURIComponent(id) + '">' + icon('medal', 'icon-sm') + ' المشتركون</a>' +
              '<button class="btn btn-ghost btn-sm delete-comp-btn" data-id="' + id + '">' + icon('trash', 'icon-sm') + ' حذف</button>' +
            '</div>' +
          '</div>';
      });
      wrap.innerHTML = html;

      wrap.querySelectorAll('.delete-comp-btn').forEach(function (btn) {
        btn.addEventListener('click', function () {
          if (!confirm('هل أنت متأكد من حذف هذا المحتوى نهائيًا؟ سيتم حذف كل محاضراتها وأسئلتها.')) return;
          db.ref('competitions/' + btn.dataset.id).remove()
            .then(function () { showToast('تم حذف المحتوى بنجاح', 'success'); })
            .catch(function (err) { showToast('تعذر الحذف: ' + err.message, 'error'); });
        });
      });
    });
  }
</script>
</body>
</html>
